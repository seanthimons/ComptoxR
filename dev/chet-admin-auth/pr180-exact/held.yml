id: chemi-chet-admin-auth
schemas:
  files:
  - schema/chemi-chet-prod.json
selection:
  include:
  - POST /auth/login
  - POST /auth/register
  - POST /auth/report
helper: .ct_request
documentation: yes
operations:
  POST /auth/login:
    name: chemi_chet_auth_login_post
    file: R/chemi_chet_auth_login_post.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: yes
    docs:
      title: Login user (POST)
      lifecycle: experimental
      description: Native canonical contract. Session and authorization behavior is
        server-defined; this function does not manage credentials or session state.
      return: Decoded JSON, text, or raw bytes according to the response content type;
        NULL for an empty response.
      tags:
        apiStage: public
  POST /auth/register:
    name: chemi_chet_auth_register_post
    file: R/chemi_chet_auth_register_post.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: yes
    docs:
      title: Register a user (POST)
      lifecycle: experimental
      description: Native canonical contract. Session and authorization behavior is
        server-defined; this function does not manage credentials or session state.
      return: Decoded JSON, text, or raw bytes according to the response content type;
        NULL for an empty response.
      tags:
        apiStage: public
  POST /auth/report:
    name: chemi_chet_auth_report_post
    file: R/chemi_chet_auth_report_post.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: yes
    docs:
      title: Report an error (POST)
      lifecycle: experimental
      description: Native canonical contract. Session and authorization behavior is
        server-defined; this function does not manage credentials or session state.
      return: Decoded JSON, text, or raw bytes according to the response content type;
        NULL for an empty response.
      tags:
        apiStage: public
