id: held-pubchem-facade
schemas:
  files:
  - schema/chemi-resolver-prod.json
selection:
  include:
  - POST /api/resolver/getpubchemlist
helper: .ct_request
documentation: no
operations:
  POST /api/resolver/getpubchemlist:
    name: chemi_resolver_getpubchemlist
    file: R/chemi_resolver_getpubchemlist.R
    helper: .ct_request
    implementation: generated
    inputs:
      query:
        type: any
      idType:
        type: any
        default: AnyId
      section:
        type: any
        default: ~
    request:
      arguments:
        method:
          value: POST
        path:
          value: /api/resolver/getpubchemlist
        path_params:
          value: {}
        query:
          object:
            page:
              from:
              - params
              - page
            itemsPerPage:
              value: 100.0
            search:
              value: ''
            linkBy:
              value: ''
            report:
              value: ''
        body:
          callback: resolved_chemical_body
        headers:
          value:
            Accept: application/json
        server:
          value:
            url: https://hcd.rtpnc.epa.gov
        server_resolver:
          value:
            name: .ct_server_url
            key: chemi_burl
            relative: /
        auth:
          value: []
        response_policy:
          callback: resolved_chemical_response
        request_controls:
          value:
            preserve_errors: yes
    request_controls:
      preserve_errors: yes
    private_params:
      chemicals: ~
    pagination:
      mode: page
      parameter: page
      start: 0.0
      completed: .ct_chemi_done
      max_pages: 100.0
      metadata: no
      error_policy: partial
      warn_errors: no
      warn_limits: yes
hook_config: inst/hook_config.yml
