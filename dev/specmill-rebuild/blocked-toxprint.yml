      arguments:
        query:
          from:
          - params
          - query
        endpoint:
          value: toxprints/calculate
        options:
          object:
            OR:
              from:
              - params
              - odds_ratio
            PV1:
              from:
              - params
              - p_val
            TP:
              from:
              - params
              - true_pos
    specialization: 'Inactive proposal: pinned native parsing blocks files[] (binary,
      source contract review #16) and the nested request query parameter. This does
      not establish schema validity. Preserve the original lazy helper evaluation,
      OR/PV1/TP field order, explicit NULL/FALSE/zero, defaults, visibility and
      errors; no schema, toolkit-pin or behavior correction is authorized.'
