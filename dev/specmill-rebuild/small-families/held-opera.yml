id: held-opera-file
schemas:
  files:
  - schema/chemi-opera-prod.json
selection:
  include:
  - POST /api/opera/file
helper: .ct_request
documentation: true
operations:
  POST /api/opera/file:
    name: chemi_opera_file
    file: R/chemi_opera_file.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: true
    docs:
      title: Calculate OPERA predictions from a file
      lifecycle: experimental
      tags:
        apiStage: public
      return: Decoded JSON or text, raw binary bytes, or NULL for an empty response.
hook_config: inst/hook_config.yml
