# Schema coverage badge policy for specmill::coverage_report(); see dev/update_coverage.R.
baseline: dev/coverage-baseline.json
groups:
  ccd:
    services: '^ctx_'
    denominator: schema
    label: CCD coverage
    badge: .github/badges/ccd-coverage.json
  chemi:
    services: '^chemi_'
    exclude: ['^OPTIONS ']
    denominator: schema
    label: Cheminformatic coverage
    badge: .github/badges/chemi-coverage.json
  epi:
    services: '^epi_'
    denominator: schema
    label: EPI Suite coverage
    badge: .github/badges/epi-coverage.json
