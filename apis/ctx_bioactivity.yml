# ctx_bioactivity: every operation in schema/ctx_bioactivity_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: ctx_bioactivity
schemas:
  files:
  - schema/ctx_bioactivity_prod.json
# CTX routes need the project's ctx API key.
authentication:
  api_key: ctx
# why: released CTX wrappers chunk vector input at batch_limit (default 100) and drop failed chunks.
defaults:
  batch:
    max_items: 100
    split: true
    on_error: drop
groups:
  ctx_bioactivity:
    hook_config: inst/hook_config.yml
    contracts_file: tests/testthat/fixtures/specmill-contracts.rds
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /bioactivity/analyticalqc/search/by-dtxsid/{dtxsid}: ct_bioactivity_analyticalqc_search_by_dtxsid
      GET /bioactivity/aop/search/by-entrez-gene-id/{entrezGeneId}: ct_bioactivity_aop_search_by_entrez_gene_id
      GET /bioactivity/aop/search/by-event-number/{eventNumber}: ct_bioactivity_aop_search_by_event_number
      GET /bioactivity/aop/search/by-toxcast-aeid/{toxcastAeid}: ct_bioactivity_aop_search_by_toxcast_aeid
      GET /bioactivity/assay/: ct_bioactivity_assay
      GET /bioactivity/assay/chemicals/search/by-aeid/{aeid}: ct_bioactivity_assay_chemicals_search_by_aeid
      GET /bioactivity/assay/count: ct_bioactivity_assay_count
      GET /bioactivity/assay/search/by-aeid/{aeid}: ct_bioactivity_assay_search_by_aeid
      GET /bioactivity/assay/search/by-endpoint/: ct_bioactivity_assay_search_by_endpoint
      GET /bioactivity/assay/search/by-gene/{geneSymbol}: ct_bioactivity_assay_search_by_gene
      GET /bioactivity/assay/single-conc/search/by-aeid/{aeid}: ct_bioactivity_assay_single_conc_search_by_aeid
      GET /bioactivity/data/aed/search/by-dtxsid/{dtxsid}: ct_bioactivity_data_aed_search_by_dtxsid
      GET /bioactivity/data/search/by-aeid/{aeid}: ct_bioactivity_data_search_by_aeid
      GET /bioactivity/data/search/by-dtxsid/{dtxsid}: ct_bioactivity_data_search_by_dtxsid
      GET /bioactivity/data/search/by-m4id/{m4id}: ct_bioactivity_data_search_by_m4id
      GET /bioactivity/data/search/by-spid/{spid}: ct_bioactivity_data_search_by_spid
      GET /bioactivity/data/summary/search/by-aeid/{aeid}: ct_bioactivity_data_summary_search_by_aeid
      GET /bioactivity/data/summary/search/by-dtxsid/{dtxsid}: ct_bioactivity_data_summary_search_by_dtxsid
      GET /bioactivity/data/summary/search/by-tissue/: ct_bioactivity_data_summary_search_by_tissue
      GET /bioactivity/models/search/: ct_bioactivity_models_search
      GET /bioactivity/models/search/by-dtxsid/{dtxsid}: ct_bioactivity_models_search_by_dtxsid
      GET /bioactivity/search/contain/{value}: ct_bioactivity_search_contain
      GET /bioactivity/search/equal/{value}: ct_bioactivity_search_equal
      GET /bioactivity/search/start-with/{value}: ct_bioactivity_search_start_with
      POST /bioactivity/assay/search/by-aeid/: ct_bioactivity_assay_search_by_aeid_bulk
      POST /bioactivity/data/aed/search/by-dtxsid/: ct_bioactivity_data_aed_search_by_dtxsid_bulk
