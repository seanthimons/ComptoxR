      GET /bioactivity/analyticalqc/search/by-dtxsid/{dtxsid}:
        security_correction:
          requirements:
            - api_key: []
          reason: Reviewed endpoint requires the declared API-key credential.
        server:
          resolver: .ct_server_url
          key: ctx_burl
        response_policy: .ct_tidy
        batch:
          fan_out: dtxsid
          on_error: drop
          empty: .ct_empty_table
        docs:
          title: Get analytical QC data by DTXSID
          lifecycle: stable
