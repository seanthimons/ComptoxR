id: alerts-pilot
schemas:
  files:
  - schema/chemi-alerts-prod.json
selection:
  include:
  - POST /api/alerts
helper: .ct_request
documentation: yes
operations:
  POST /api/alerts:
    name: chemi_alerts
    file: R/chemi_alerts.R
    helper: .ct_request
    implementation: generated
    inputs:
      query:
        type: any
      idType:
        type: any
        default: AnyId
      options:
        type: any
        default: ~
      request.filesInfo:
        type: any
        default: ~
      request.options.alerts:
        type: any
        default: ~
      request.options.resolve:
        type: any
        default: ~
    private_params:
      chemicals: ~
    request:
      arguments:
        method:
          value: POST
        path:
          value: /api/alerts
        path_params:
          value: {}
        query:
          object:
            request.filesInfo:
              from:
              - params
              - request.filesInfo
            request.options.alerts:
              from:
              - params
              - request.options.alerts
            request.options.resolve:
              from:
              - params
              - request.options.resolve
        body:
          callback: resolved_chemical_body
        headers:
          value:
            Accept: application/json
        server:
          value:
            url: https://hcd.rtpnc.epa.gov
        server_resolver:
          value:
            name: .ct_server_url
            key: chemi_burl
            relative: /
        auth:
          value: []
        response_policy:
          callback: resolved_chemical_response
        request_controls:
          value:
            preserve_errors: yes
    docs:
      title: chemi alerts
      lifecycle: experimental
      return: Decoded response records, with the configured client formatting.
      parameters:
        query: Character vector of chemical identifiers (DTXSIDs, CAS, SMILES, InChI,
          etc.)
        idType: 'Type of identifier. Options: DTXSID, DTXCID, SMILES, MOL, CAS, Name,
          InChI, InChIKey, InChIKey_1, AnyId (default)'
        options: Optional parameter
        request.filesInfo: Optional parameter
        request.options.alerts: Optional parameter
        request.options.resolve: Optional parameter
      tags:
        apiStage: public
    exclude_parameters:
    - files[]
    - request
    request_controls:
      preserve_errors: yes
contracts_file: tests/testthat/fixtures/specmill-pilot-contracts.rds
hook_config: inst/hook_config.yml
prepare: preserve_choice_defaults
