id: chemi-arn_cats
schemas:
  files:
  - schema/chemi-arn_cats-prod.json
selection:
  methods:
  - GET
  - POST
  exclude:
  - render|replace|add|freeze|metadata|version|reports|webtest/report|download|export|protocols|preflight|universalpreflight|caspreflight|file|admin|auth|login|logout|register|index|errorreport|testpage|curators|reaction/editor|chemdelete|reactiondelete|visibility|mapfix|newchem|newreact|newlibrary|_DL|_dl|chemtemp|resolver/(?:casharvest|universalharvest(?:_cart)?)$
helper: generic_chemi_request
policy_version: comptox-maintenance-1
hook_config: inst/hook_config.yml
names:
  GET /api/arn_cats: chemi_arn_cats
  POST /api/arn_cats: chemi_arn_cats_bulk
operations:
  GET /api/arn_cats:
    inputs:
      smiles:
        required: yes
      model:
        required: no
        default: RF
        type: character
    file: R/chemi_arn_cats.R
    helper: generic_request
    request:
      arguments:
        endpoint:
          value: arn_cats
        method:
          value: GET
        batch_limit:
          value: 0.0
        server:
          value: chemi_burl
        auth:
          value: no
        tidy:
          value: no
        options:
          compact_object:
            smiles:
              from:
              - params
              - smiles
            model:
              from:
              - params
              - model
    docs:
      title: Generate an ARN category for one molecule
      return: Returns a list with result object
      lifecycle: experimental
      parameters:
        smiles: SMILES to generate groups for
        model: 'Model to use for group prediction. Options: RF, NN (default: RF)'
      tags:
        apiStage: public
      examples:
      - smiles: DTXSID7020182
  POST /api/arn_cats:
    inputs:
      chemicals:
        required: no
        default: ~
        type: object
      model:
        required: no
        default: RF
        type: character
      smiles:
        required: no
        default: ~
        type: object
    file: R/chemi_arn_cats.R
    helper: generic_chemi_request
    request:
      arguments:
        query:
          from:
          - params
          - chemicals
        endpoint:
          value: arn_cats
        options:
          compact_object:
            model:
              from:
              - params
              - model
            smiles:
              from:
              - params
              - smiles
        tidy:
          value: no
    docs:
      title: Generate groups for multiple molecules
      return: Returns a list with result object
      lifecycle: experimental
      parameters:
        chemicals: Array of objects with optional id and smiles, or an array of SMILES
          strings for backward compatibility.
        model: 'Optional parameter. Options: RF, NN (default: RF)'
        smiles: Array of SMILES strings, same input style as amnb_nate.
      tags:
        apiStage: public
      examples:
      - chemicals: DTXSID1024122
documentation: yes
contracts_file: tests/testthat/fixtures/apipak/chemi-arn_cats.rds
