# chemi_padel: every operation in schema/chemi_padel_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: chemi_padel
schemas:
  files:
  - schema/chemi_padel_prod.json
groups:
  chemi_padel:
    hook_config: inst/hook_config.yml
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /api/padel: chemi_padel
      GET /api/padel/metadata: chemi_padel_metadata
      GET /api/padel/version: chemi_padel_version
      POST /api/padel: chemi_padel_bulk
    operations:
      # why: inputs keep released argument names/defaults; post-processing still runs when a hook skips the request; post-processing state carries hook data; request arguments pin the released wire call; docs keep the released title, return and examples; server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; hooks/extra arguments come from inst/hook_config.yml
      GET /api/padel:
        inputs:
          smiles:
            type: character
            required: yes
            description: One SMILES string or resolvable chemical identifier
          x2d:
            type: logical
            default: yes
            description: 'Calculate two-dimensional descriptors (default: TRUE)'
          x3d:
            type: logical
            default: no
            description: 'Calculate three-dimensional descriptors (default: FALSE)'
          fp:
            type: logical
            default: no
            description: 'Calculate fingerprints (default: FALSE)'
          headers:
            type: logical
            default: no
            description: 'Request upstream descriptor headers (default: FALSE)'
          timeout:
            type: character
            default: ~
            description: Optional upstream calculation timeout
          output:
            type: character
            default:
              - wide
              - raw
            description: 'Output contract: validated wide tibble or raw payload'
        post_on_skip: yes
        post_state: hook_state
        request:
          arguments:
            method:
              value: GET
            path:
              from:
                - hook_state
                - request
                - endpoint
            path_params:
              value: {}
            query:
              from:
                - hook_state
                - request
                - options
            body:
              value: ~
            headers:
              object:
                Accept:
                  from:
                    - hook_state
                    - request
                    - content_type
            server:
              object:
                url:
                  from:
                    - hook_state
                    - request
                    - server
            auth:
              value: []
            response_policy:
              callback: descriptor_get_response
            request_controls:
              value:
                preserve_errors: yes
        docs:
          title: Padel
          lifecycle: experimental
          parameters:
            smiles: One SMILES string or resolvable chemical identifier
            x2d: 'Calculate two-dimensional descriptors (default: TRUE)'
            x3d: 'Calculate three-dimensional descriptors (default: FALSE)'
            fp: 'Calculate fingerprints (default: FALSE)'
            headers: 'Request upstream descriptor headers (default: FALSE)'
            timeout: Optional upstream calculation timeout
            output: 'Output contract: validated wide tibble or raw payload'
          return: Returns a tibble with results
          examples:
            - smiles: DTXSID7020182
          tags:
            apiStage: public
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/padel/metadata:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve padel metadata
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/padel/version:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve padel version
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: inputs keep released argument names/defaults; post-processing still runs when a hook skips the request; post-processing state carries hook data; request arguments pin the released wire call; docs keep the released title, return and examples; server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; hooks/extra arguments come from inst/hook_config.yml
      POST /api/padel:
        inputs:
          query:
            type: character
            required: yes
            description: Chemical structures or resolvable identifiers
          x2d:
            type: logical
            default: yes
            description: Calculate two-dimensional descriptors
