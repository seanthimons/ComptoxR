# chemi_chet: every operation in schema/chemi_chet_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: chemi_chet
schemas:
  files:
  - schema/chemi_chet_prod.json
groups:
  chemi_chet:
    hook_config: inst/hook_config.yml
    contracts_file: tests/testthat/fixtures/specmill-contracts.rds
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /chemicals/{chemical_id}/image: chemi_chet_chemicals_image
      GET /chemicals/alias: chemi_chet_chemicals_alias
      GET /chemicals/chemset: chemi_chet_chemicals_chemset
      GET /chemicals/chemtemp/{type}/{value}: chemi_chet_chemicals_chemtemp
      GET /chemicals/counts: chemi_chet_chemicals_counts
      GET /chemicals/database: chemi_chet_chemicals_database
      GET /chemicals/database-old: chemi_chet_chemicals_database_old
      GET /chemicals/database/stats: chemi_chet_chemicals_database_stats
      GET /chemicals/maps: chemi_chet_chemicals_maps
      GET /chemicals/singlechemical: chemi_chet_chemicals_singlechemical
      GET /chemicals/suggest: chemi_chet_chemicals_suggest
      GET /chemicals/verify/{dtxsid}: chemi_chet_chemicals_verify
      GET /curators/detail-sets: chemi_chet_curators_detail_sets
      GET /curators/libraries/{lib_id}: chemi_chet_curators_libraries
      GET /curators/libraries/detail-options: chemi_chet_curators_libraries_detail_options
      GET /curators/me: chemi_chet_curators_me
      GET /curators/units: chemi_chet_curators_units
      GET /metadata: chemi_chet_metadata
      GET /reaction/database: chemi_chet_reaction_database
      GET /reaction/database_old: chemi_chet_reaction_database_old
      GET /reaction/database-old/{pagenum}/{searchterm}: chemi_chet_reaction_database_old_by_pagenum_and_searchterm  # why: path name collides with a sibling route; disambiguated by its path parameter
      GET /reaction/database/stats: chemi_chet_reaction_database_stats
      GET /reaction/dbcounts: chemi_chet_reaction_dbcounts
      GET /reaction/details: chemi_chet_reaction_details
      GET /reaction/download_DB_backup: chemi_chet_reaction_download_db_backup
      GET /reaction/editor/{reaction_id}: chemi_chet_reaction_editor
      GET /reaction/editor/library-details: chemi_chet_reaction_editor_library_details
      GET /reaction/libraries: chemi_chet_reaction_libraries
      GET /reaction/mapid: chemi_chet_reaction_mapid
      GET /reaction/mappositions/{map_id}: chemi_chet_reaction_mappositions
      GET /reaction/maps: chemi_chet_reaction_maps
      GET /reaction/react_maps: chemi_chet_reaction_react_maps
      GET /reaction/reactionmap: chemi_chet_reaction_reactionmap
      GET /reaction/search: chemi_chet_reaction_search
      GET /reaction/searchcounts/{search_input}/{search_type}: chemi_chet_reaction_searchcounts
      GET /reaction/singlereaction: chemi_chet_reaction_singlereaction
      GET /reaction/table: chemi_chet_reaction_table
      GET /version: chemi_chet_version
      POST /chemicals/newchemfile: chemi_chet_chemicals_newchemfile
      POST /chemicals/newchemical: chemi_chet_chemicals_newchemical
      POST /chemicals/template_DL: chemi_chet_chemicals_template_dl
      POST /curators/change-password: chemi_chet_curators_change_password
      POST /curators/details: chemi_chet_curators_details
      POST /curators/login: chemi_chet_curators_login
      POST /curators/logout: chemi_chet_curators_logout
      POST /reaction/batchsearch: chemi_chet_reaction_batchsearch
      POST /reaction/editor/check-existing: chemi_chet_reaction_editor_check_existing
      POST /reaction/editor/check-existing-map: chemi_chet_reaction_editor_check_existing_map
      POST /reaction/editor/load-map: chemi_chet_reaction_editor_load_map
      POST /reaction/editor/load-reactions: chemi_chet_reaction_editor_load_reactions
      POST /reaction/editor/save-scheme: chemi_chet_reaction_editor_save_scheme
      POST /reaction/map_DL: chemi_chet_reaction_map_dl
      POST /reaction/mapfix/{map_id}: chemi_chet_reaction_mapfix
      POST /reaction/newlibrary: chemi_chet_reaction_newlibrary
      POST /reaction/newreactfile: chemi_chet_reaction_newreactfile
      POST /reaction/newreaction: chemi_chet_reaction_newreaction
      POST /reaction/reaction_dl: chemi_chet_reaction_reaction_dl
      POST /reaction/reactiondelete: chemi_chet_reaction_reactiondelete
      POST /reaction/template_DL: chemi_chet_reaction_template_dl
      POST /reaction/visibility: chemi_chet_reaction_visibility
    operations:
      # why: inputs keep released argument names/defaults; accepts the released identifier/query input forms; request arguments pin the released wire call; docs keep the released title, return and examples; request controls keep the released error behaviour; hooks/extra arguments come from inst/hook_config.yml
      GET /chemicals/{chemical_id}/image:
        inputs:
          chemical_id:
            type: any
          width:
            default: ~
            type: any
          height:
            default: ~
            type: any
          format:
            default: png
            type: any
        normalize_inputs:
          chemical_id: .ct_single_path_query
        request:
          arguments:
            method:
              value: GET
            path:
              value: /api/chet/chemicals/{chemical_id}/image
            path_params:
              object:
                chemical_id:
                  from:
                    - params
                    - chemical_id
            query:
              object:
                width:
                  from:
                    - params
                    - width
                height:
                  from:
                    - params
                    - height
                format:
                  from:
                    - params
                    - format
            body:
              value: ~
            headers:
              value:
                Accept: application/pdf, image/png, image/svg+xml
            server:
              value:
                url: https://hcd.rtpnc.epa.gov
            server_resolver:
              value:
                name: .ct_server_url
                key: chemi_burl
                relative: /
            auth:
              value: []
            response_policy:
              callback: chet_image_response
            request_controls:
              value:
                preserve_errors: yes
        docs:
          title: Render a chemical structure image
          lifecycle: experimental
          return: A magick image for PNG or SVG, or raw bytes for PDF.
          tags:
            apiStage: public
          examples:
            - chemical_id: 1.0
          parameters:
            chemical_id: 'ChET chemical ID. Type: integer.'
            width: Optional parameter
            height: Optional parameter
            format: 'Optional parameter. Options: png, svg, pdf (default: png)'
        request_controls:
          preserve_errors: yes
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /chemicals/alias:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Fetch aliases for a chemical
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - {}
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /chemicals/chemset:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: List chemicals by library
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - {}
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /chemicals/chemtemp/{type}/{value}:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
        docs:
          title: Fetch temporary chemical details
          lifecycle: experimental
          return: Decoded JSON, text, or raw download bytes according to the response content
            type; NULL for an empty response.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; pagination matches the server's paging contract; docs keep the released title, return and examples; request arguments pin the released wire call; hooks/extra arguments come from inst/hook_config.yml
      GET /chemicals/counts:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_chemi_page
        pagination:
          mode: page
          parameter: page
          start: 1
          completed: .ct_chemi_done
          max_pages: 100
          metadata: no
          error_policy: partial
          warn_errors: no
          warn_limits: yes
          on_limit: .ct_keyset_limit_warning
          stop_on_empty: no
        docs:
          title: Chemical counts by library
          lifecycle: experimental
          return: A list of records.
          examples:
            - page: 1
              all_pages: no
              max_pages: 2
          tags:
            apiStage: public
        request:
          arguments:
            method:
              value: GET
            path:
              value: /chemicals/counts
            path_params:
              value: []
            query:
              object:
                page:
                  from:
                    - params
                    - page
                size:
                  from:
                    - params
                    - size
            body:
              value: ~
            response_policy:
              callback: page_response_policy
            server:
              value:
                diagnostic: Relative server URL requires a recorded origin or explicit base
                  URL override
            server_resolver:
              value:
                name: .ct_server_url
                key: chemi_burl
                relative: /api/chet
            auth:
              value: []
            headers:
              value:
                Accept: application/json
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; pagination matches the server's paging contract; docs keep the released title, return and examples; request arguments pin the released wire call; hooks/extra arguments come from inst/hook_config.yml
      GET /chemicals/database:
