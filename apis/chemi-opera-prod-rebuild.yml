id: chemi-opera-prod-rebuild
schemas:
  files:
  - schema/chemi-opera-prod.json
selection:
  include:
  - GET /api/opera
  - GET /api/opera/report
  - POST /api/opera
helper: generic_request
documentation: yes
operations:
  GET /api/opera:
    name: chemi_opera
    file: R/chemi_opera.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    response_policy: .ct_static_list
    docs:
      title: Opera
      lifecycle: experimental
      return: Returns a list of results
      examples:
      - smiles: DTXSID7020182
      tags:
        apiStage: public
  GET /api/opera/report:
    name: chemi_opera_report
    file: R/chemi_opera_report.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    response_policy: .ct_static_list
    docs:
      title: Generate a standalone OPERA calculation report
      lifecycle: experimental
      return: Returns a list of results
      examples:
      - dtxsid: DTXSID7020182
        modelId: 1
      tags:
        apiStage: public
  POST /api/opera:
    name: chemi_opera_bulk
    file: R/chemi_opera.R
    helper: .ct_request
    implementation: generated
    inputs:
      cache_only:
        type: logical
        default: no
        description: 'Return only predictions found in the response cache and list
          uncached inputs without running OPERA. If the persistent cache is unavailable,
          OPERA falls back to in-memory cache and reports misses. (default: FALSE)'
      smiles:
        type: character
        default: ~
        description: Optional parameter
      chemicals:
        type: character
        default: ~
        description: Optional parameter
      format:
        type: character
        default: json
        description: 'Format to return predictions in (json, csv, xlsx) (default:
          json)'
      standardize:
        type: logical
        default: no
        description: 'Standardize chemical before calculating predictions (default:
          FALSE)'
    post_on_skip: no
    post_state: parameters
    request:
      arguments:
        method:
          value: POST
        path:
          value: /api/opera
        path_params:
          value: {}
        query:
          object:
            format:
              from:
              - params
              - format
            standardize:
              from:
              - params
              - standardize
        body:
          callback: prediction_body
        headers:
          value:
            Accept: application/json
        server:
          value:
            diagnostic: Swagger host/scheme requires a recorded origin or explicit
              base URL override
        server_resolver:
          value:
            name: .ct_server_url
            key: chemi_burl
            relative: /
        auth:
          value: []
        response_policy:
          value: .ct_prediction
    docs:
      title: Generate predictions for multiple molecules
      lifecycle: experimental
      parameters:
        cache_only: 'Return only predictions found in the response cache and list
          uncached inputs without running OPERA. If the persistent cache is unavailable,
          OPERA falls back to in-memory cache and reports misses. (default: FALSE)'
        smiles: Optional parameter
        chemicals: Optional parameter
        format: 'Format to return predictions in (json, csv, xlsx) (default: json)'
        standardize: 'Standardize chemical before calculating predictions (default:
          FALSE)'
      return: Returns a list with result object
      examples:
      - smiles:
        - CCO
        - CCCC
        cache_only: yes
      tags:
        apiStage: public
    server:
      resolver: .ct_server_url
      key: chemi_burl
contracts_file: tests/testthat/fixtures/specmill-rebuild-contracts.rds
