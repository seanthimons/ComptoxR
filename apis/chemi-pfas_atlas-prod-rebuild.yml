id: chemi-pfas_atlas-prod-rebuild
schemas:
  files:
  - schema/chemi-pfas_atlas-prod.json
selection:
  include:
  - GET /api/pfas_atlas
  - POST /api/pfas_atlas
helper: generic_request
documentation: yes
operations:
  GET /api/pfas_atlas:
    name: chemi_pfas_atlas
    file: R/chemi_pfas_atlas.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    response_policy: .ct_static_list
    docs:
      title: Generate PFAS Atlas categories for one molecule
      lifecycle: experimental
      return: Returns a list of results
      examples:
      - smiles: O=C(O)C(F)(F)C(F)(F)C(F)(F)C(F)(F)F
      tags:
        apiStage: public
  POST /api/pfas_atlas:
    name: chemi_pfas_atlas_bulk
    file: R/chemi_pfas_atlas.R
    helper: .ct_request
    implementation: generated
    inputs:
      chemicals:
        type: character
        default: ~
        description: Either an array of input chemicals with optional id and required
          smiles, or an array of SMILES strings for backward compatibility.
      smiles:
        type: character
        default: ~
        description: Array of SMILES strings, kept for backward compatibility with
          the previous PFAS Atlas POST format.
    request:
      arguments:
        method:
          value: POST
        path:
          value: /api/pfas_atlas
        path_params:
          value: {}
        query:
          value: {}
        body:
          callback: classifier_body
        headers:
          value:
            Accept: application/json
        server:
          value:
            diagnostic: Relative server URL requires a recorded origin or explicit
              base URL override
        server_resolver:
          value:
            name: .ct_server_url
            key: chemi_burl
            relative: ''
        auth:
          value: ~
        response_policy:
          value: .ct_prediction
    docs:
      title: Generate PFAS Atlas categories for multiple molecules
      lifecycle: experimental
      parameters:
        chemicals: Either an array of input chemicals with optional id and required
          smiles, or an array of SMILES strings for backward compatibility.
        smiles: Array of SMILES strings, kept for backward compatibility with the
          previous PFAS Atlas POST format.
      return: Returns a list with result object
      examples:
      - chemicals: DTXSID1024122
      tags:
        apiStage: public
    server:
      resolver: .ct_server_url
      key: chemi_burl
contracts_file: tests/testthat/fixtures/specmill-rebuild-contracts.rds
