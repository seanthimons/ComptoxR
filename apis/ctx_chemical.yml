# ctx_chemical: every operation in schema/ctx_chemical_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: ctx_chemical
schemas:
  files:
  - schema/ctx_chemical_prod.json
# CTX routes need the project's ctx API key.
authentication:
  api_key: ctx
# why: released CTX wrappers chunk vector input at batch_limit (default 100) and drop failed chunks.
defaults:
  batch:
    max_items: 100
    split: true
    on_error: drop
groups:
  ctx_chemical:
    hook_config: inst/hook_config.yml
    contracts_file: tests/testthat/fixtures/specmill-contracts.rds
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /chemical/count/by-exact-formula/{formula}: ct_chemical_count_by_exact_formula
      GET /chemical/count/by-msready-formula/{formula}: ct_chemical_count_by_msready_formula
      GET /chemical/detail/search/by-dtxcid/{dtxcid}: ct_chemical_detail_search_by_dtxcid
      GET /chemical/detail/search/by-dtxsid/{dtxsid}: ct_chemical_detail_search_by_dtxsid
      GET /chemical/detail/search/by-smiles/: ct_chemical_detail_search_by_smiles
      GET /chemical/extra-data/search/by-dtxsid/{dtxsid}: ct_chemical_extra_data_search_by_dtxsid
      GET /chemical/fate/search/by-dtxsid/{dtxsid}: ct_chemical_fate_search_by_dtxsid
      GET /chemical/fate/summary/experimental/search/: ct_chemical_fate_summary_experimental_search
      GET /chemical/fate/summary/predicted/search/: ct_chemical_fate_summary_predicted_search
      GET /chemical/fate/summary/search/: ct_chemical_fate_summary_search
      GET /chemical/fate/summary/search/by-dtxsid/{dtxsid}: ct_chemical_fate_summary_search_by_dtxsid
      GET /chemical/file/image/search/by-dtxcid/{dtxcid}: ct_chemical_file_image_search_by_dtxcid
      GET /chemical/file/image/search/by-dtxsid/{dtxsid}: ct_chemical_file_image_search_by_dtxsid
      GET /chemical/file/image/search/by-gsid/{gsid}: ct_chemical_file_image_search_by_gsid
      GET /chemical/file/mol/search/by-dtxcid/{dtxcid}: ct_chemical_file_mol_search_by_dtxcid
      GET /chemical/file/mol/search/by-dtxsid/{dtxsid}: ct_chemical_file_mol_search_by_dtxsid
      GET /chemical/list/all: ct_chemical_list_all
      GET /chemical/list/chemicals/search/by-listname/{list}: ct_chemical_list_chemicals_search_by_listname
      GET /chemical/list/chemicals/search/contain/{list}/{word}: ct_chemical_list_chemicals_search_contain
      GET /chemical/list/chemicals/search/equal/{list}/{word}: ct_chemical_list_chemicals_search_equal
      GET /chemical/list/chemicals/search/start-with/{list}/{word}: ct_chemical_list_chemicals_search_start_with
      GET /chemical/list/search/by-dtxsid/{dtxsid}: ct_chemical_list_search_by_dtxsid
      GET /chemical/list/search/by-name/{listName}: ct_chemical_list_search_by_name
      GET /chemical/list/search/by-type/{type}: ct_chemical_list_search_by_type
      GET /chemical/list/type: ct_chemical_list_type
      GET /chemical/msready/search/by-dtxcid/{dtxcid}: ct_chemical_msready_search_by_dtxcid
      GET /chemical/msready/search/by-formula/{formula}: ct_chemical_msready_search_by_formula
      GET /chemical/msready/search/by-mass/{start}/{end}: ct_chemical_msready_search_by_mass
      GET /chemical/property/experimental/name: ct_chemical_property_experimental_name
      GET /chemical/property/experimental/search/by-dtxsid/{dtxsid}: ct_chemical_property_experimental_search_by_dtxsid
      GET /chemical/property/experimental/search/by-range/{propertyName}/{start}/{end}: ct_chemical_property_experimental_search_by_range
      GET /chemical/property/predicted/name: ct_chemical_property_predicted_name
      GET /chemical/property/predicted/search/by-dtxsid/{dtxsid}: ct_chemical_property_predicted_search_by_dtxsid
      GET /chemical/property/predicted/search/by-range/{propertyId}/{start}/{end}: ct_chemical_property_predicted_search_by_range
      GET /chemical/property/summary/experimental/search/: ct_chemical_property_summary_experimental_search
      GET /chemical/property/summary/predicted/search/: ct_chemical_property_summary_predicted_search
      GET /chemical/property/summary/search/: ct_chemical_property_summary_search
      GET /chemical/property/summary/search/by-dtxsid/{dtxsid}: ct_chemical_property_summary_search_by_dtxsid
      GET /chemical/search/by-exact-formula/{formula}: ct_chemical_search_by_exact_formula
      GET /chemical/search/by-msready-formula/{formula}: ct_chemical_search_by_msready_formula
      GET /chemical/search/contain/{word}: ct_chemical_search_contain
      GET /chemical/search/equal/{word}: ct_chemical_search_equal
      GET /chemical/search/start-with/{word}: ct_chemical_search_start_with
      GET /chemical/synonym/search/by-dtxsid/{dtxsid}: ct_chemical_synonym_search_by_dtxsid
      POST /chemical/detail/search/by-dtxcid/: ct_chemical_detail_search_by_dtxcid_bulk
      POST /chemical/detail/search/by-dtxsid/: ct_chemical_detail_search_by_dtxsid_bulk
      POST /chemical/extra-data/search/by-dtxsid/: ct_chemical_extra_data_search_by_dtxsid_bulk
