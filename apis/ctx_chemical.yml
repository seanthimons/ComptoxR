      POST /chemical/property/experimental/search/by-dtxsid/: ct_chemical_property_experimental_search_by_dtxsid_bulk
      POST /chemical/property/predicted/search/by-dtxsid/: ct_chemical_property_predicted_search_by_dtxsid_bulk
      POST /chemical/search/by-msready-formula/: ct_chemical_search_by_msready_formula_bulk
      POST /chemical/search/equal/: ct_chemical_search_equal_bulk
      POST /chemical/synonym/search/by-dtxsid/: ct_chemical_synonym_search_by_dtxsid_bulk
    operations:
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; batching keeps the released vector fan-out and error handling; docs keep the released title, return and examples; accepts the released identifier/query input forms
      GET /chemical/count/by-exact-formula/{formula}:
        server:
          resolver: .ct_server_url
          key: ctx_burl
        response_policy: .ct_tidy
        batch:
          fan_out: formula
          on_error: drop
          empty: .ct_empty_table
        docs:
          title: Get chemical count by exact formula
          lifecycle: experimental
          return: Returns a tibble with results
          tags:
            apiStage: public
          examples:
            - formula: C15H16O2
        normalize_inputs:
          formula: .ct_legacy_query
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; batching keeps the released vector fan-out and error handling; docs keep the released title, return and examples; accepts the released identifier/query input forms
      GET /chemical/count/by-msready-formula/{formula}:
        server:
          resolver: .ct_server_url
          key: ctx_burl
