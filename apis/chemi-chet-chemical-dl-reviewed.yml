  - GET /chemicals/chemical_DL
helper: .ct_request
documentation: yes
operations:
  GET /chemicals/chemical_DL:
    name: chemi_chet_chemicals_chemical_dl
    file: R/chemi_chet_chemicals_chemical_dl.R
    implementation: generated
    body_media: application/json
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: yes
