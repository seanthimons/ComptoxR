    operations:
      # why: server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/amos/additional_sources_for_substance/{dtxsid}:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
        docs:
          title: Retrieves links for supplemental sources (e.g., Wikipedia, ChemExpo) for
            a given DTXSID, if any are available.
          lifecycle: experimental
          return: Decoded JSON, text, or raw workbook bytes according to the response content
            type; NULL for an empty response.
          tags:
            apiStage: public
      # why: inputs keep released argument names/defaults; request arguments pin the released wire call; pagination matches the server's paging contract; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/amos/analytical_qc_keyset_pagination/{limit}:
        inputs:
          limit:
            type: integer
            required: yes
            description: limit
          cursor:
            type: character
            default: ~
            description: cursor
        request:
          arguments:
            method:
              value: GET
            path:
              value: /api/amos/analytical_qc_keyset_pagination/{limit}
            path_params:
              object:
                limit:
                  from:
                    - params
                    - limit
            query:
              object:
                cursor:
                  from:
                    - params
                    - cursor
            body:
              value: ~
            headers:
              value:
                Accept: application/json
            server:
              value:
                diagnostic: Reviewed AMOS production origin.
            server_resolver:
              value:
                name: .ct_server_url
                key: chemi_burl
                relative: /
            auth:
              value: []
            response_policy:
              callback: keyset_response
        pagination:
          mode: cursor
          parameter: cursor
          next_cursor: .ct_keyset_next
          completed: .ct_keyset_done
          items: .ct_keyset_items
          max_pages: 100
          metadata: no
          error_policy: partial
          warn_errors: no
          warn_limits: yes
          on_limit: .ct_keyset_limit_warning
          stop_on_empty: no
        docs:
          title: chemi amos analytical qc keyset pagination
          lifecycle: experimental
          return: A list of records when all_pages is TRUE, otherwise the original response
            envelope.
          examples:
            - limit: 1
              all_pages: no
              max_pages: 2
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples; renamed from chemi_amos_database
