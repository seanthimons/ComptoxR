# chemi_ncc_cats: every operation in schema/chemi_ncc_cats_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: chemi_ncc_cats
schemas:
  files:
  - schema/chemi_ncc_cats_prod.json
groups:
  chemi_ncc_cats:
    hook_config: inst/hook_config.yml
    contracts_file: tests/testthat/fixtures/specmill-contracts.rds
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /api/ncc_cats: chemi_ncc_cats
      GET /api/ncc_cats/metadata: chemi_ncc_cats_metadata
      GET /api/ncc_cats/version: chemi_ncc_cats_version
      POST /api/ncc_cats: chemi_ncc_cats_bulk
    operations:
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/ncc_cats:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Generate NCC categories for one molecule
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - smiles: DTXSID7020182
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/ncc_cats/metadata:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve ncc cats metadata
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/ncc_cats/version:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve ncc cats version
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: inputs keep released argument names/defaults; request arguments pin the released call, with the body following the service schema; docs keep the released title and return; hooks come from inst/hook_config.yml; server resolver keeps the user-overridable base URL option
      POST /api/ncc_cats:
        inputs:
          chemicals:
            type: character
            default: ~
            description: Chemicals to classify, as a character vector of SMILES or of DTXSID, DTXCID or CASRN identifiers, which are resolved to SMILES first (names, if any, are sent as ids, otherwise the identifier or SMILES is; duplicates are dropped), a data frame with id and smiles columns and optional logp and ws columns, or a list of such records. Identifiers inside records are not resolved.
        request:
          arguments:
            method:
              value: POST
            path:
              value: /api/ncc_cats
            path_params:
              value: {}
            query:
              value: {}
            body:
              callback: classifier_body
            headers:
              value:
                Accept: application/json
            server:
              value:
                diagnostic: Relative server URL requires a recorded origin or explicit base
                  URL override
            server_resolver:
              value:
                name: .ct_server_url
                key: chemi_burl
                relative: ''
            auth:
              value: ~
            response_policy:
              value: .ct_prediction
        docs:
          title: Generate NCC categories for multiple molecules
          lifecycle: experimental
          parameters:
            chemicals: Chemicals to classify, as a character vector of SMILES or of DTXSID, DTXCID or CASRN identifiers, which are resolved to SMILES first (names, if any, are sent as ids, otherwise the identifier or SMILES is; duplicates are dropped), a data frame with id and smiles columns and optional logp and ws columns, or a list of such records. Identifiers inside records are not resolved.
          return: Returns a list with result object
          examples:
            - chemicals: DTXSID7020182
          tags:
            apiStage: public
        server:
          resolver: .ct_server_url
          key: chemi_burl
