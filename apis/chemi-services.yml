    inputs: {}
    file: R/chemi_services_cim_component_info.R
    helper: generic_request
    request:
      arguments:
        endpoint:
          value: services/cim_component_info
        method:
          value: GET
        batch_limit:
          value: 0.0
        server:
          value: chemi_burl
        auth:
          value: no
        tidy:
          value: no
    docs:
      title: Services Cim Component Info
      return: Returns a tibble with results
      lifecycle: experimental
      tags:
        apiStage: public
      examples:
