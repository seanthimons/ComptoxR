# chemi_opera: every operation in schema/chemi_opera_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: chemi_opera
schemas:
  files:
  - schema/chemi_opera_prod.json
groups:
  chemi_opera:
    hook_config: inst/hook_config.yml
    contracts_file: tests/testthat/fixtures/specmill-contracts.rds
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /api/opera: chemi_opera
      GET /api/opera/metadata: chemi_opera_metadata
      GET /api/opera/report: chemi_opera_report
      GET /api/opera/version: chemi_opera_version
      POST /api/opera: chemi_opera_bulk
      POST /api/opera/file: chemi_opera_file
    operations:
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/opera:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Opera
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - smiles: DTXSID7020182
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/opera/metadata:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve opera metadata
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/opera/report:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Generate a standalone OPERA calculation report
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - dtxsid: DTXSID7020182
              modelId: 1
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/opera/version:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve opera version
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: inputs keep released argument names/defaults; post-processing still runs when a hook skips the request; post-processing state carries hook data; request arguments pin the released wire call; docs keep the released title, return and examples; server resolver keeps the user-overridable base URL option
      POST /api/opera:
        inputs:
          cache_only:
            type: logical
            default: no
            description: 'Return only predictions found in the response cache and list uncached
              inputs without running OPERA. If the persistent cache is unavailable, OPERA
              falls back to in-memory cache and reports misses. (default: FALSE)'
          smiles:
            type: character
            default: ~
            description: Optional parameter
          chemicals:
            type: character
            default: ~
            description: Optional parameter
          format:
            type: character
            default: json
            description: 'Format to return predictions in (json, csv, xlsx) (default: json)'
          standardize:
            type: logical
            default: no
            description: 'Standardize chemical before calculating predictions (default: FALSE)'
        post_on_skip: no
        post_state: parameters
        request:
          arguments:
            method:
              value: POST
            path:
              value: /api/opera
            path_params:
              value: {}
            query:
              object:
                format:
                  from:
                    - params
                    - format
                standardize:
                  from:
                    - params
                    - standardize
            body:
              callback: prediction_body
            headers:
              value:
                Accept: application/json
            server:
              value:
                diagnostic: Swagger host/scheme requires a recorded origin or explicit base
                  URL override
            server_resolver:
              value:
                name: .ct_server_url
                key: chemi_burl
                relative: /
            auth:
              value: []
            response_policy:
              value: .ct_prediction
        docs:
          title: Generate predictions for multiple molecules
          lifecycle: experimental
          parameters:
            cache_only: 'Return only predictions found in the response cache and list uncached
              inputs without running OPERA. If the persistent cache is unavailable, OPERA
              falls back to in-memory cache and reports misses. (default: FALSE)'
            smiles: Optional parameter
            chemicals: Optional parameter
            format: 'Format to return predictions in (json, csv, xlsx) (default: json)'
            standardize: 'Standardize chemical before calculating predictions (default: FALSE)'
          return: Returns a list with result object
          examples:
            - smiles:
                - CCO
                - CCCC
              cache_only: yes
          tags:
            apiStage: public
        server:
          resolver: .ct_server_url
          key: chemi_burl
      # why: server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      POST /api/opera/file:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
        docs:
          title: Calculate OPERA predictions from a file
          lifecycle: experimental
          tags:
            apiStage: public
          return: Decoded JSON or text, raw binary bytes, or NULL for an empty response.
