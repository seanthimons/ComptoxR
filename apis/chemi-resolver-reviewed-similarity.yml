{
  "id": "chemi-resolver-reviewed-similarity",
  "schemas": {
    "files": [
      "schema/chemi-resolver-reviewed-similarity.json"
    ]
  },
  "selection": {
    "include": [
      "POST /api/resolver/getsimilaritylist"
    ]
  },
  "helper": ".ct_request",
  "documentation": true,
  "operations": {
    "POST /api/resolver/getsimilaritylist": {
      "name": "chemi_resolver_getsimilaritylist",
      "file": "R/chemi_resolver_getsimilaritylist.R",
      "helper": ".ct_request",
      "implementation": "generated",
      "inputs": {
        "query": {
          "type": "any"
        },
        "main": {
          "type": "any"
        },
        "idType": {
          "type": "any",
          "default": "AnyId"
        },
        "fingerprintName": {
          "type": "any",
          "default": "indigo"
        },
        "scoreName": {
          "type": "any",
          "default": "tanimoto"
        },
        "padelCompute2D": {
          "type": "any",
          "default": null
        },
        "padelCompute3D": {
          "type": "any",
          "default": null
        },
        "padelComputeFingerprints": {
          "type": "any",
          "default": null
        },
        "rdkitBits": {
          "type": "any",
          "default": null
        },
        "rdkitRadius": {
          "type": "any",
          "default": null
        },
        "rdkitType": {
          "type": "any",
          "default": null
        },
        "toxprintsProfile": {
          "type": "any",
          "default": null
        },
        "tverskyI": {
          "type": "any",
          "default": null
        }
      },
      "private_params": {
        "reference_chemical": null,
        "candidate_chemicals": null
      },
      "request": {
        "arguments": {
          "method": {
            "value": "POST"
          },
          "path": {
            "value": "/api/resolver/getsimilaritylist"
          },
          "path_params": {
            "value": {}
          },
          "query": {
            "value": {}
          },
          "body": {
            "callback": "similarity_list_body"
          },
          "headers": {
            "value": {
              "Accept": "application/json"
            }
          },
          "server": {
            "value": {
              "url": "https://hcd.rtpnc.epa.gov"
            }
          },
          "server_resolver": {
            "value": {
              "name": ".ct_server_url",
              "key": "chemi_burl",
              "relative": "/"
            }
          },
          "auth": {
            "value": []
          },
          "response_policy": {
            "value": ".ct_list"
          }
        }
      },
      "docs": {
        "title": "Compare a reference chemical with supplied candidate chemicals",
        "lifecycle": "experimental",
        "description": "Resolves one reference and a candidate set, then calculates similarities within that set. Does not search a chemical database for new candidates. The reference is excluded from returned candidates.",
        "return": "A list of API Row objects containing chemical, max and similarity fields. Returns NULL with a warning when no candidates resolve.",
        "parameters": {
          "query": "Character vector of 1 to 1000 candidate chemical identifiers. Unresolved candidates are omitted.",
          "main": "One reference chemical identifier, resolved separately from query.",
          "idType": "Identifier type for both reference and candidates; defaults to AnyId.",
          "fingerprintName": "Fingerprint engine. Default indigo is verified; other engines require compatible scoring settings.",
          "scoreName": "Similarity score. Default tanimoto is verified with indigo."
        },
        "tags": {
          "apiStage": "public"
        },
        "examples": [
          {
            "query": "DTXSID9020112",
            "main": "DTXSID7020182"
          }
        ]
      }
    }
  },
  "hook_config": "inst/hook_config.yml"
}
