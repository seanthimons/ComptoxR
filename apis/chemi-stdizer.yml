id: chemi-stdizer
schemas:
  files:
  - schema/chemi-stdizer-prod.json
selection:
  methods:
  - GET
  - POST
  exclude:
  - render|replace|add|freeze|metadata|version|reports|webtest/report|download|export|protocols|preflight|universalpreflight|caspreflight|file|admin|auth|login|logout|register|index|errorreport|testpage|curators|reaction/editor|chemdelete|reactiondelete|visibility|mapfix|newchem|newreact|newlibrary|_DL|_dl|chemtemp|resolver/(?:casharvest|universalharvest(?:_cart)?)$
helper: generic_chemi_request
policy_version: comptox-maintenance-1
hook_config: inst/hook_config.yml
names:
  GET /api/stdizer: chemi_stdizer
  POST /api/stdizer: chemi_stdizer_bulk
  POST /api/stdizer/chemicals: chemi_stdizer_chemicals
  GET /api/stdizer/groups: chemi_stdizer_groups
  POST /api/stdizer/groups: chemi_stdizer_groups_bulk
  GET /api/stdizer/groups/{id}: chemi_stdizer_groups_by_id
  GET /api/stdizer/groups/{id}/recursive: chemi_stdizer_groups_recursive
  GET /api/stdizer/operations: chemi_stdizer_operations
  POST /api/stdizer/records: chemi_stdizer_records
  GET /api/stdizer/workflows: chemi_stdizer_workflows
operations:
  GET /api/stdizer:
    inputs:
      workflow:
        required: yes
      smiles:
        required: yes
    file: R/chemi_stdizer.R
    helper: generic_request
    request:
      arguments:
        endpoint:
          value: stdizer
        method:
          value: GET
        batch_limit:
          value: 0.0
        server:
          value: chemi_burl
        auth:
          value: no
        tidy:
          value: no
        options:
          compact_object:
            workflow:
              from:
              - params
              - workflow
            smiles:
              from:
              - params
              - smiles
    docs:
      title: Stdizer
      return: Returns a tibble with results
      lifecycle: experimental
      parameters:
        workflow: Required parameter
        smiles: Required parameter
      tags:
        apiStage: public
      examples:
      - workflow: DTXSID7020182
  GET /api/stdizer/groups:
    inputs: {}
    file: R/chemi_stdizer_groups.R
    helper: generic_request
    request:
