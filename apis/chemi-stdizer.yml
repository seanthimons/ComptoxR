    request:
      arguments:
        query:
          from:
          - params
          - id
        endpoint:
          value: stdizer/groups/
        method:
          value: GET
        batch_limit:
          value: 1.0
        server:
          value: chemi_burl
        auth:
          value: no
        tidy:
          value: no
    docs:
      title: Stdizer Groups
      return: Returns a tibble with results
      lifecycle: experimental
      parameters:
        id: 'Primary query parameter. Type: string'
      tags:
        apiStage: public
      examples:
