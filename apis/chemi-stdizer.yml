    file: R/chemi_stdizer_chemicals.R
    helper: generic_chemi_request
    request:
      arguments:
        query:
          from:
          - params
          - query
        endpoint:
          value: stdizer/chemicals
        options:
          compact_object:
            full:
              from:
              - params
              - full
            options:
              from:
              - params
              - options
        tidy:
          value: no
        chemicals:
          from:
          - hook_state
          - params
          - chemicals
    docs:
      title: Stdizer Chemicals
      return: Returns a tibble with results
      lifecycle: experimental
      description: |-
        This function first resolves chemical identifiers using `chemi_resolver_lookup_bulk`,
        then sends the resolved Chemical objects to the API endpoint.
      parameters:
        query: Character vector of chemical identifiers (DTXSIDs, CAS, SMILES, InChI,
          etc.)
        idType: 'Type of identifier. Options: DTXSID, DTXCID, SMILES, MOL, CAS, Name,
          InChI, InChIKey, InChIKey_1, AnyId (default)'
        full: Optional parameter
        options: Optional parameter
      tags:
        apiStage: public
      examples:
      - query:
        - 50-00-0
        - DTXSID7020182
