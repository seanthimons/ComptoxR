id: chemi-toxprint-prod-rebuild
schemas:
  files:
  - schema/chemi-toxprints-prod.json
# Include list on purpose: chemi-toxprints-prod-rebuild also maps POST /api/toxprints/calculate
# (chemi_toxprints_calculate_bulk). Under opt-out selection only one service can claim the
# operation, so the single-chemical and bulk wrappers stay on explicit include lists.
selection:
  include:
  - POST /api/toxprints/calculate
helper: generic_chemi_request
documentation: yes
operations:
  POST /api/toxprints/calculate:
    name: chemi_toxprint
    file: R/chemi_toxprint.R
    helper: .ct_request
    implementation: generated
    inputs:
      query:
        type: character
        required: yes
        description: A list of DTXSIDs
      odds_ratio:
        type: integer
        default: 3
        description: numeric
      p_val:
        type: numeric
        default: 0.05
        description: numeric
      true_pos:
        type: numeric
        default: 3.0
        description: numeric
    request:
      arguments:
        method:
          value: POST
        path:
          value: /api/toxprints/calculate
        path_params:
          value: {}
        query:
          value: {}
        body:
          object:
            chemicals:
              callback: toxprint_chemicals
            options:
              object:
                OR:
                  from:
                  - params
                  - odds_ratio
                PV1:
                  from:
                  - params
                  - p_val
                TP:
                  from:
                  - params
                  - true_pos
        headers:
          value:
            Accept: application/json
        server:
          value: []
        server_resolver:
          value:
            name: .ct_server_url
            key: chemi_burl
            relative: /
        auth:
          value: []
        response_policy:
          callback: toxprint_response
    exclude_parameters:
    - files[]
    - request
    normalize_inputs:
      query: .ct_toxprint_query
    preserve_visibility: yes
    docs:
      title: ToxPrint Chemotyper
      return: A dataframe.
      examples:
      - query: DTXSID7020182
contracts_file: tests/testthat/fixtures/specmill-rebuild-contracts.rds
