# chemi_safety: every operation in schema/chemi_safety_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: chemi_safety
schemas:
  files:
  - schema/chemi_safety_prod.json
groups:
  chemi_safety:
    hook_config: inst/hook_config.yml
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /api/safety/metadata: chemi_safety_metadata
      GET /api/safety/version: chemi_safety_version
      POST /api/safety/rqcodes: chemi_safety_rqcodes
    operations:
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/safety/metadata:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve safety metadata
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/safety/version:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve safety version
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: inputs keep released argument names/defaults; accepts the released identifier/query input forms; hides internal parameters from the public signature; request arguments pin the released wire call; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      POST /api/safety/rqcodes:
        inputs:
          query:
            type: any
            default: ~
        normalize_inputs:
          query: .ct_safety_sids
        private_params:
          chemicals: ~
          idType: DTXSID
        request:
          arguments:
            method:
              value: POST
            path:
              value: /api/safety/rqcodes
            path_params:
              value: {}
            query:
              value: {}
            body:
              from:
                - params
                - chemicals
            headers:
              value:
                Accept: application/json
            server:
              value:
                url: https://hcd.rtpnc.epa.gov
            server_resolver:
              value:
                name: .ct_server_url
                key: chemi_burl
                relative: /
            auth:
              value: []
            response_policy:
              callback: resolved_chemical_response
            request_controls:
              value:
                preserve_errors: yes
        request_controls:
          preserve_errors: yes
        docs:
          title: Safety RQ codes
          lifecycle: stable
          return: A tibble of available RQ codes with numeric rq_lbs and rq_kgs, or NULL when
            none are available.
          parameters:
            query: Character vector of DTXSIDs, resolved before requesting RQ codes.
          examples:
            - query: DTXSID0020153
