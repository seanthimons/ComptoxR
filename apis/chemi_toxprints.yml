          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/toxprints/metadata:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve toxprints metadata
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/toxprints/render:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Render a ToxPrints chemical
          lifecycle: experimental
          return: The decoded service response, preserving JSON structure, text or media bytes.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/toxprints/toxprints:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Toxprints Toxprints
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - {}
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/toxprints/version:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve toxprints version
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: inputs keep released argument names/defaults; request arguments pin the released wire call; docs keep the released title, return and examples; accepts the released identifier/query input forms; batching keeps the released vector fan-out and error handling; request controls keep the released error behaviour; hooks/extra arguments come from inst/hook_config.yml
      POST /api/toxprints:
        inputs:
          query:
            type: any
            required: yes
            description: Character vector of strings to send in request body
        request:
          arguments:
            method:
              value: POST
            path:
              value: /api/toxprints
            path_params:
              value: {}
            query:
              value: {}
            body:
              callback: toxprints_canonical_body
            headers:
              value:
                Accept: application/json
            server:
              value:
                url: https://hcd.rtpnc.epa.gov
            server_resolver:
              value:
                name: .ct_server_url
                key: chemi_burl
                relative: /
            auth:
              value: []
            response_policy:
              callback: toxprints_bulk_response
            request_controls:
              value:
                preserve_errors: yes
        docs:
          title: Toxprints
          lifecycle: experimental
          parameters:
            query: Character vector of chemical structure strings. SMILES work in production
              and development; DTXSID support depends on the service deployment.
          return: One row per chemical, with descriptor vectors and service metadata retained
            in descriptors and info list-columns.
          examples:
            - query: CCO
          tags:
            apiStage: public
          description: Calculates ToxPrint descriptors using the Cheminformatics service without
            CTX authentication. Inputs are cleaned and split by batch_limit, default 100.
        normalize_inputs:
          query: .ct_legacy_query
        batch:
          input: query
          split: yes
          max_items:
            env: batch_limit
            default: 100
          on_error:
            single: stop
            multiple: drop
          metadata: no
          warning: no
          empty: .ct_empty_table
        request_controls:
          preserve_errors: yes
      # why: inputs keep released argument names/defaults; post-processing still runs when a hook skips the request; post-processing state carries hook data; request arguments pin the released wire call; docs keep the released title, return and examples; request controls keep the released error behaviour; hooks/extra arguments come from inst/hook_config.yml
