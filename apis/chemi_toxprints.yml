# chemi_toxprints: every operation in schema/chemi_toxprints_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: chemi_toxprints
schemas:
  files:
  - schema/chemi_toxprints_prod.json
groups:
  chemi_toxprints:
    hook_config: inst/hook_config.yml
    contracts_file: tests/testthat/fixtures/specmill-contracts.rds
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /api/toxprints: chemi_toxprints
      GET /api/toxprints/assays: chemi_toxprints_assays
      GET /api/toxprints/assays/{name}: chemi_toxprints_assays_by_name  # why: path name collides with a sibling route; disambiguated by its path parameter
      GET /api/toxprints/assays/check: chemi_toxprints_assays_check
      GET /api/toxprints/calculate: chemi_toxprints_calculate
      GET /api/toxprints/download: chemi_toxprints_download
      GET /api/toxprints/enrichments: chemi_toxprints_enrichments
      GET /api/toxprints/global_assays: chemi_toxprints_global_assays
      GET /api/toxprints/global_toxprints: chemi_toxprints_global_toxprints
      GET /api/toxprints/metadata: chemi_toxprints_metadata
      GET /api/toxprints/render: chemi_toxprints_render
      GET /api/toxprints/toxprints: chemi_toxprints_toxprints
      GET /api/toxprints/version: chemi_toxprints_version
      POST /api/toxprints: chemi_toxprints_bulk
      POST /api/toxprints/assays: chemi_toxprints_assays_bulk
      POST /api/toxprints/calculate: chemi_toxprints_calculate_bulk
      POST /api/toxprints/chemicals_categories: chemi_toxprints_chemicals_categories
      POST /api/toxprints/export: chemi_toxprints_export
      POST /api/toxprints/export_global: chemi_toxprints_export_global
      POST /api/toxprints/toxprints_categories: chemi_toxprints_toxprints_categories
    operations:
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/toxprints:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Toxprints
          lifecycle: experimental
          return: A list containing the API response envelope with service metadata, chemicals
            and optional descriptor headers.
          description: Calculates ToxPrint descriptors for one structure and preserves the
            API response envelope. Use chemi_toxprints_bulk for a row-per-chemical table.
          parameters:
            smiles: One SMILES string. DTXSID acceptance depends on the service deployment.
            headers: Include descriptor names in the response; defaults to FALSE.
            profile: Optional profile name; NULL uses the service default.
          examples:
            - smiles: CCO
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/toxprints/assays:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Toxprints Assays
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - {}
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; batching keeps the released vector fan-out and error handling; docs keep the released title, return and examples; accepts the released identifier/query input forms
      GET /api/toxprints/assays/{name}:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_list
        batch:
          fan_out: name
          on_error: drop
        docs:
          title: Toxprints Assays
          lifecycle: experimental
          return: Returns a list of results
          tags:
            apiStage: public
          examples:
            - name: DTXSID7020182
        normalize_inputs:
          name: .ct_legacy_query
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/toxprints/assays/check:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Toxprints Assays Check
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - name: DTXSID7020182
          tags:
            apiStage: public
      # why: inputs keep released argument names/defaults; request arguments pin the released wire call; docs keep the released title, return and examples; request controls keep the released error behaviour; hooks/extra arguments come from inst/hook_config.yml
      GET /api/toxprints/calculate:
        inputs:
          smiles:
            type: character
          labels:
            type: logical
            default: no
          profile:
            type: character
            default: ~
        request:
          arguments:
            method:
              value: GET
            path:
              value: /api/toxprints/calculate
            path_params:
              value: {}
            query:
              object:
                smiles:
                  from:
                    - params
                    - smiles
                labels:
                  from:
                    - params
                    - labels
                profile:
                  from:
                    - params
                    - profile
            body:
              value: ~
            headers:
              value:
                Accept: application/json
            server:
              value:
                url: https://hcd.rtpnc.epa.gov
            server_resolver:
              value:
                name: .ct_server_url
                key: chemi_burl
                relative: /
            auth:
              value: []
            response_policy:
              callback: static_collected_response
            request_controls:
              value:
                preserve_errors: yes
        docs:
          title: Toxprints Calculate
          lifecycle: experimental
          return: A list of decoded response records.
          tags:
            apiStage: public
          parameters:
            smiles: Required parameter
            labels: 'Optional parameter (default: FALSE)'
            profile: Optional parameter
          examples:
            - smiles: CCCC
        request_controls:
          preserve_errors: yes
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/toxprints/download:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Download a ToxPrints file
          lifecycle: experimental
          return: The decoded service response, preserving JSON structure, text or media bytes.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/toxprints/enrichments:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Toxprints Enrichments
          lifecycle: experimental
          return: Returns a list of results
          tags:
            apiStage: public
          examples:
            - {}
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/toxprints/global_assays:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Toxprints Global Assays
