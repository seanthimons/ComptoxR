id: ctx-exposure-prod-rebuild
schemas:
  files:
  - schema/ctx-exposure-prod.json
selection:
  include:
  - GET /exposure/functional-use/category
  - GET /exposure/functional-use/probability/search/by-dtxsid/{dtxsid}
  - GET /exposure/functional-use/search/by-dtxsid/{dtxsid}
  - GET /exposure/seem/demographic/search/by-dtxsid/{dtxsid}
  - POST /exposure/functional-use/search/by-dtxsid/
  - POST /exposure/seem/demographic/search/by-dtxsid/
helper: generic_request
documentation: yes
authentication:
  api_key: ctx
defaults:
  batch:
    max_items: 100
    split: yes
    on_error: drop
operations:
  GET /exposure/functional-use/category:
    name: ct_exposure_functional_use_category
    file: R/ct_exposure_functional_use_category.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: ctx_burl
    response_policy: .ct_tidy
    docs:
      title: Get functional use categories
      lifecycle: stable
      return: Returns a tibble with results
      examples:
      - {}
  GET /exposure/functional-use/probability/search/by-dtxsid/{dtxsid}:
    name: ct_exposure_functional_use_probability_search
    file: R/ct_exposure_functional_use_probability_search.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: ctx_burl
    response_policy: .ct_tidy
    batch:
      fan_out: dtxsid
      on_error: drop
      empty: .ct_empty_table
    docs:
      title: Get functional use probability by DTXSID
      lifecycle: stable
      return: Returns a tibble with results
      examples:
      - dtxsid: DTXSID0020232
    normalize_inputs:
      dtxsid: .ct_legacy_query
  GET /exposure/functional-use/search/by-dtxsid/{dtxsid}:
    name: ct_exposure_functional_use_search
    file: R/ct_exposure_functional_use_search.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: ctx_burl
    response_policy: .ct_tidy
    batch:
      fan_out: dtxsid
      on_error: drop
      empty: .ct_empty_table
    docs:
      title: Get functional use data by DTXSID
      lifecycle: stable
      return: Returns a tibble with results
      examples:
      - dtxsid: DTXSID0020232
    normalize_inputs:
      dtxsid: .ct_legacy_query
  GET /exposure/seem/demographic/search/by-dtxsid/{dtxsid}:
    name: ct_exposure_seem_demographic_search
    file: R/ct_exposure_seem_demographic_search.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: ctx_burl
    response_policy: .ct_tidy
    batch:
      fan_out: dtxsid
      on_error: drop
      empty: .ct_empty_table
    docs:
      title: Get SEEM Demographic Exposure Prediction data by DTXSID
      lifecycle: stable
      return: Returns a tibble with results
      examples:
      - dtxsid: DTXSID0020232
    normalize_inputs:
      dtxsid: .ct_legacy_query
  POST /exposure/functional-use/search/by-dtxsid/:
    name: ct_exposure_functional_use_search_bulk
    file: R/ct_exposure_functional_use_search.R
    helper: .ct_request
    implementation: generated
    body:
      name: dtxsid
      description: DSSTox substance identifiers.
    server:
      resolver: .ct_server_url
      key: ctx_burl
    response_policy: .ct_tidy
    docs:
      title: Get functional-use data for a batch of DTXSIDs
      lifecycle: stable
      return: Returns a tibble with results
      examples:
      - dtxsid:
        - DTXSID7020182
        - DTXSID2021315
    normalize_inputs:
      dtxsid: .ct_legacy_query
    batch:
      max_items:
        env: batch_limit
        default: 100
      split: yes
      on_error: drop
      empty: .ct_empty_table
  POST /exposure/seem/demographic/search/by-dtxsid/:
    name: ct_exposure_seem_demographic_search_bulk
    file: R/ct_exposure_seem_demographic_search.R
    helper: .ct_request
    implementation: generated
    body:
      name: dtxsid
      description: DSSTox substance identifiers.
    server:
      resolver: .ct_server_url
      key: ctx_burl
    response_policy: .ct_tidy
    docs:
      title: Get SEEM Demographic Exposure Prediction data for batch of DTXSIDs
      lifecycle: stable
      return: Returns a tibble with results
      examples:
      - dtxsid:
        - DTXSID7020182
        - DTXSID2021315
    normalize_inputs:
      dtxsid: .ct_legacy_query
    batch:
      max_items:
        env: batch_limit
        default: 100
      split: yes
      on_error: drop
      empty: .ct_empty_table
contracts_file: tests/testthat/fixtures/specmill-rebuild-contracts.rds
