        server:
          value:
            url: https://hcd.rtpnc.epa.gov
        server_resolver:
          value:
            name: .ct_server_url
            key: chemi_burl
            relative: /
        auth:
          value: []
        response_policy:
          callback: lookup_response
    normalize_inputs:
      ids: .ct_lookup_ids
    docs:
      title: Resolver Lookup (Bulk)
      lifecycle: stable
      return: A tibble when tidy is TRUE, otherwise the decoded JSON response.
      examples:
      - ids:
        - DTXSID7020182
        - 50-00-0
      parameters:
        ids: Character vector of chemical identifiers to look up. All identifiers
          must be of the same type or type should be AnyId.
        idsType: 'Type of identifier. Options: DTXSID, DTXCID, SMILES, MOL, CAS, Name,
          InChI, InChIKey, InChIKey_1, AnyId (default: AnyId)'
        fuzzy: 'Fuzzy lookup setting. Options: Not, Anywhere, Start, Word, CloseSyntactic,
          CloseSemantic (default: Not)'
        mol: 'If TRUE, MOL is requested as a result (default: FALSE)'
        filters: Optional filters object
        format: 'Optional format specification. Options: UNKNOWN, SDF, SMI, MOL, CSV,
          TSV, JSON, XLSX, PDF, HTML, XML, DOCX'
        tidy: Logical; if TRUE (default), return a tibble. If FALSE, return a cleaned
          list.
      description: Performs bulk lookup of chemical identifiers via POST endpoint.
    defer_inputs: tidy
