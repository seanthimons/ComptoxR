        type: character
        required: yes
      idsType:
        type: character
        default: AnyId
      fuzzy:
        type: character
        default: Not
      mol:
        type: logical
        default: no
      filters:
        type: character
        default: ~
      format:
        type: character
        default: ~
      tidy:
        type: logical
