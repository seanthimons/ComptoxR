# ctx_hazard: every operation in schema/ctx_hazard_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: ctx_hazard
schemas:
  files:
  - schema/ctx_hazard_prod.json
# CTX routes need the project's ctx API key.
authentication:
  api_key: ctx
# why: released CTX wrappers chunk vector input at batch_limit (default 100) and drop failed chunks.
defaults:
  batch:
    max_items: 100
    split: true
    on_error: drop
groups:
  ctx_hazard:
    hook_config: inst/hook_config.yml
    contracts_file: tests/testthat/fixtures/specmill-contracts.rds
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /hazard/adme-ivive/search/by-dtxsid/{dtxsid}: ct_hazard_adme_ivive_search_by_dtxsid
      GET /hazard/cancer-summary/search/by-dtxsid/{dtxsid}: ct_hazard_cancer_summary_search_by_dtxsid
      GET /hazard/genetox/details/search/by-dtxsid/{dtxsid}: ct_hazard_genetox_details_search_by_dtxsid
      GET /hazard/genetox/summary/search/by-dtxsid/{dtxsid}: ct_hazard_genetox_summary_search_by_dtxsid
      GET /hazard/hawc/search/by-dtxsid/{dtxsid}: ct_hazard_hawc_search_by_dtxsid
      GET /hazard/iris/search/by-dtxsid/{dtxsid}: ct_hazard_iris_search_by_dtxsid
      GET /hazard/pprtv/search/by-dtxsid/{dtxsid}: ct_hazard_pprtv_search_by_dtxsid
      GET /hazard/skin-eye/search/by-dtxsid/{dtxsid}: ct_hazard_skin_eye_search_by_dtxsid
