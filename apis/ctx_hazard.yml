      GET /hazard/toxref/data/search/by-study-id/{studyId}: ct_hazard_toxref_data_search_by_study_id
      GET /hazard/toxref/data/search/by-study-type/{studyType}: ct_hazard_toxref_data_search_by_study_type
      GET /hazard/toxref/effects/search/by-dtxsid/{dtxsid}: ct_hazard_toxref_effects_search_by_dtxsid
      GET /hazard/toxref/effects/search/by-study-id/{studyId}: ct_hazard_toxref_effects_search_by_study_id
      GET /hazard/toxref/effects/search/by-study-type/{studyType}: ct_hazard_toxref_effects_search_by_study_type
      GET /hazard/toxref/observations/search/by-dtxsid/{dtxsid}: ct_hazard_toxref_observations_search_by_dtxsid
      GET /hazard/toxref/observations/search/by-study-id/{studyId}: ct_hazard_toxref_observations_search_by_study_id
      GET /hazard/toxref/observations/search/by-study-type/{studyType}: ct_hazard_toxref_observations_search_by_study_type
