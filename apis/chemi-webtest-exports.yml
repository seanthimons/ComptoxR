id: chemi-webtest-exports
schemas:
  files:
  - schema/chemi-webtest-prod.json
selection:
  include:
  - POST /api/webtest/predict/export
  - POST /api/webtest/export-append
helper: .ct_request
documentation: true
operations:
  POST /api/webtest/predict/export:
    name: chemi_webtest_predict_export
    file: R/chemi_webtest_predict_export.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: true
    docs:
      title: Export WebTEST predictions
      lifecycle: experimental
      tags:
        apiStage: public
      return: Decoded JSON or text, raw binary bytes, or NULL for an empty response.
  POST /api/webtest/export-append:
    name: chemi_webtest_export_append
    file: R/chemi_webtest_export_append.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: true
    docs:
      title: Append WebTEST predictions to an uploaded report
      lifecycle: experimental
      tags:
        apiStage: public
      return: Decoded JSON or text, raw binary bytes, or NULL for an empty response.
hook_config: inst/hook_config.yml
