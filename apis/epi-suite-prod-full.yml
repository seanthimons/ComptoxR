  GET /api/submit:
    name: epi_submit
    file: R/epi_submit.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: epi_burl
    response_policy: .ct_static_list
    docs:
      title: Estimate one chemical
      lifecycle: experimental
      return: Returns a named list of result modules
      tags:
        apiStage: public
      examples:
      - smiles: CCO
        modules: logKow
    inputs:
      smiles:
        default: ~
        type: character
        description: SMILES; required when cas is absent.
      cas:
        default: ~
        type: character
        description: CAS Registry Number; required when smiles is absent.
      modules:
        default: ~
        type: character
        description: 'Comma-separated canonical public module names; defaults to all.
          Array order does not control scientific precedence: selected modules run
          in canonical dependency order, with waterSolubilityProvider controlling
          the shared WSKOW/WaterNT choice. Exact implementation IDs are accepted for
          CLI parity but public names are the durable HTTP contract.'
      chemicalName:
        default: ~
        type: character
        description: Optional parameter
      logKow:
        default: ~
        type: numeric
        description: Optional parameter
      molecularWeight:
        default: ~
        type: numeric
        description: Optional resolved molecular weight in g/mol. Together with positive
          vapor pressure and water solubility, it enables the HENRYWIN VP/WSOL candidate;
          Bond and Group require only SMILES.
      waterSolubilityMgPerL:
        default: ~
        type: numeric
        description: Optional resolved water solubility in mg/L. A positive VP/WSOL/MW
          triplet enables the HENRYWIN VP/WSOL candidate; omission does not prevent
          Bond or Group estimation.
      waterSolubility:
        default: ~
        type: numeric
        description: Optional parameter
      waterSolubilityProvider:
        default: wskow
        type: character
        description: 'Selects the source used for downstream resolved water solubility.
          Both WSKOW and WaterNT independent results remain visible when all modules
          run.. Options: wskow, waternt (default: wskow)'
      vaporPressureMmHg:
        default: ~
        type: numeric
        description: Optional resolved vapor pressure in mmHg. A positive VP/WSOL/MW
          triplet enables the HENRYWIN VP/WSOL candidate; omission does not prevent
          Bond or Group estimation.
      subcooledVaporPressureMmHg:
        default: ~
        type: numeric
        description: Optional parameter
      henryAtmM3PerMol:
        default: ~
        type: numeric
        description: Optional parameter
      logKoa:
        default: ~
        type: numeric
        description: Optional parameter
      koc:
