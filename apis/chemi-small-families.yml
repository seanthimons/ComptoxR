id: chemi-small-families
schemas:
  files:
  - schema/chemi-predictor_models-prod.json
  - schema/chemi-webtest-prod.json
selection:
  include:
  - GET /api/predictor_models/model/file/
  - GET /api/webtest/report
helper: .ct_request
documentation: true
operations:
  GET /api/predictor_models/model/file/:
    name: chemi_predictor_models_model_file
    file: R/chemi_predictor_models_model_file.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: true
    docs:
      title: Retrieve a predictor model file
      lifecycle: experimental
      tags:
        apiStage: public
      return: Decoded JSON or text, raw binary bytes, or NULL for an empty response.
  GET /api/webtest/report:
    name: chemi_webtest_report
    file: R/chemi_webtest_report.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: true
    docs:
      title: Retrieve a previously generated WebTEST report
      lifecycle: experimental
      tags:
        apiStage: public
      return: Decoded JSON or text, raw binary bytes, or NULL for an empty response.
hook_config: inst/hook_config.yml
