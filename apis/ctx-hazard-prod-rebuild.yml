id: ctx-hazard-prod-rebuild
schemas:
  files:
  - schema/ctx-hazard-prod.json
selection:
  include:
  - GET /hazard/adme-ivive/search/by-dtxsid/{dtxsid}
  - GET /hazard/hawc/search/by-dtxsid/{dtxsid}
  - GET /hazard/iris/search/by-dtxsid/{dtxsid}
  - GET /hazard/pprtv/search/by-dtxsid/{dtxsid}
  - GET /hazard/toxval/supercategory/search/by-dtxsid/{dtxsid}
helper: generic_request
documentation: yes
operations:
  GET /hazard/adme-ivive/search/by-dtxsid/{dtxsid}:
    name: ct_hazard_adme_ivive_search
    file: R/ct_hazard_adme_ivive_search.R
    helper: generic_request
    implementation: generated
    inputs:
      dtxsid:
        type: character
        required: yes
        description: 'DSSTox Substance Identifier. Type: string'
      projection:
        type: character
        default: ~
        description: 'Specifies if projection is used. Option: ccd-adme-data. If omitted,
          the default ADME-IVIVE projection is returned.'
    request:
      arguments:
        query:
          from:
          - params
          - dtxsid
        endpoint:
          value: hazard/adme-ivive/search/by-dtxsid/
        method:
          value: GET
        batch_limit:
          value: 1.0
        projection:
          from:
          - params
          - projection
    docs:
      title: Get ADME data for IVIVE by DTXSID with CCD projection
      lifecycle: stable
      parameters:
        dtxsid: 'DSSTox Substance Identifier. Type: string'
        projection: 'Specifies if projection is used. Option: ccd-adme-data. If omitted,
          the default ADME-IVIVE projection is returned.'
      return: Returns a scalar value
      examples:
      - dtxsid: DTXSID7020182
