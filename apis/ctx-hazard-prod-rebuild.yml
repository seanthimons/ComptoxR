        type: character
        required: yes
        description: 'DSSTox Substance Identifier. Type: string'
      projection:
        type: character
        default: ~
        description: 'Specifies if projection is used. Option: ccd-adme-data. If omitted,
          the default ADME-IVIVE projection is returned.'
    request:
      arguments:
        query:
          from:
          - params
          - dtxsid
        endpoint:
          value: hazard/adme-ivive/search/by-dtxsid/
        method:
          value: GET
        batch_limit:
          value: 1.0
        projection:
          from:
          - params
          - projection
    docs:
      title: Get ADME data for IVIVE by DTXSID with CCD projection
      lifecycle: stable
      parameters:
        dtxsid: 'DSSTox Substance Identifier. Type: string'
        projection: 'Specifies if projection is used. Option: ccd-adme-data. If omitted,
