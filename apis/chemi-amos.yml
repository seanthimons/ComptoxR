operations:
  GET /api/amos/analytical_qc_keyset_pagination/{limit}:
    inputs:
      limit:
        required: yes
      cursor:
        required: no
        default: ~
        type: object
      all_pages:
        required: no
        default: yes
        type: logical
      max_pages:
        required: no
        default: 100.0
        type: numeric
    file: R/chemi_amos_analytical_qc_keyset_pagination.R
    helper: generic_request
    request:
      arguments:
        query:
          from:
          - params
          - limit
        endpoint:
          value: amos/analytical_qc_keyset_pagination/
        method:
          value: GET
        batch_limit:
          value: 1.0
        server:
          value: chemi_burl
        auth:
          value: no
        tidy:
          value: no
        options:
          compact_object:
            cursor:
              from:
              - params
              - cursor
        paginate:
          from:
          - params
          - all_pages
        max_pages:
          from:
          - params
          - max_pages
        pagination_strategy:
          value: cursor
        pagination_cursor_location:
          value: query
    docs:
      title: Returns information on a batch of Analytical QC documents using keyset
        pagination.
      return: Returns a tibble with results
      lifecycle: experimental
      parameters:
        limit: Limit of records to return.
        cursor: Optional keyset cursor returned by a previous response.
        all_pages: Logical; if TRUE (default), automatically fetches all pages. If
          FALSE, returns a single page using manual pagination parameters.
        max_pages: Maximum number of pages to fetch when all_pages is TRUE.
      tags:
        apiStage: public
      examples:
      - limit: DTXSID7020182
  POST /api/amos/count_substances_in_ids/:
    inputs:
      internal_id_list:
        required: no
        default: ~
        type: object
    file: R/chemi_amos_count_substances_in_ids.R
