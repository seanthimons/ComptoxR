id: chemi-chet-prod-full
schemas:
  files:
  - schema/chemi_chet_prod.json
selection:
  include:
  - GET /chemicals/database-old
  - GET /chemicals/verify/{dtxsid}
  - GET /reaction/database_old
  - GET /reaction/dbcounts
  - GET /reaction/libraries
  - GET /reaction/mappositions/{map_id}
  - GET /reaction/maps
helper: .ct_request
documentation: yes
operations:
  GET /chemicals/database-old:
    name: chemi_chet_chemicals_database_old
    file: R/chemi_chet_chemicals_database_old.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    response_policy: .ct_static_list
    docs:
      title: List all chemicals (legacy)
      lifecycle: experimental
      return: Returns a list of results
      tags:
        apiStage: public
      examples:
      - {}
  GET /chemicals/verify/{dtxsid}:
    name: chemi_chet_chemicals_verify
    file: R/chemi_chet_chemicals_verify.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    response_policy: .ct_list
    batch:
      fan_out: dtxsid
      on_error: drop
    docs:
      title: Verify a DTXSID against DSSTOX
      lifecycle: experimental
      return: Returns a list of results
      tags:
        apiStage: public
      examples:
      - dtxsid: DTXSID7020182
    normalize_inputs:
      dtxsid: .ct_legacy_query
  GET /reaction/database_old:
    name: chemi_chet_reaction_database_old
    file: R/chemi_chet_reaction_database_old.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    response_policy: .ct_static_list
    docs:
      title: List all reactions (legacy)
      lifecycle: experimental
      return: Returns a list of results
      tags:
        apiStage: public
      examples:
      - {}
  GET /reaction/dbcounts:
    name: chemi_chet_reaction_dbcounts
    file: R/chemi_chet_reaction_dbcounts.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    response_policy: .ct_static_list
    docs:
      title: Count chemicals and reactions
      lifecycle: experimental
      return: Returns a list of results
      tags:
        apiStage: public
      examples:
      - {}
  GET /reaction/libraries:
    name: chemi_chet_reaction_libraries
    file: R/chemi_chet_reaction_libraries.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    docs:
      title: List reaction libraries
      lifecycle: experimental
      return: Returns a tibble with results (array of objects)
      tags:
        apiStage: public
      examples:
      - {}
  GET /reaction/mappositions/{map_id}:
    name: chemi_chet_reaction_mappositions
    file: R/chemi_chet_reaction_mappositions.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    response_policy: .ct_list
    batch:
      fan_out: map_id
      on_error: drop
    docs:
      title: Fetch stored reaction-map node positions
      lifecycle: experimental
      return: Returns a list of results
      tags:
        apiStage: public
      examples:
      - map_id: DTXSID7020182
    normalize_inputs:
      map_id: .ct_legacy_query
  GET /reaction/maps:
    name: chemi_chet_reaction_maps
    file: R/chemi_chet_reaction_maps.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    response_policy: .ct_static_list
    docs:
      title: List maps
      lifecycle: experimental
      return: Returns a list of results
      tags:
        apiStage: public
      examples:
      - {}
contracts_file: tests/testthat/fixtures/specmill-full-contracts.rds
