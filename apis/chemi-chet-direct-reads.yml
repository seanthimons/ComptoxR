id: chemi-chet-direct-reads
schemas:
  files:
  - schema/chemi_chet_prod.json
selection:
  include:
  - GET /metadata
  - GET /version
  - GET /chemicals/chemtemp/{type}/{value}
  - GET /curators/me
helper: .ct_request
documentation: true
operations:
  GET /metadata:
    name: chemi_chet_metadata
    file: R/chemi_chet_metadata.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: true
    docs:
      title: Read CheT service metadata
      lifecycle: experimental
      return: Decoded JSON, text, or raw download bytes according to the response
        content type; NULL for an empty response.
      tags:
        apiStage: public
  GET /version:
    name: chemi_chet_version
    file: R/chemi_chet_version.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: true
    docs:
      title: Read CheT service version
      lifecycle: experimental
      return: Decoded JSON, text, or raw download bytes according to the response
        content type; NULL for an empty response.
      tags:
        apiStage: public
  GET /chemicals/chemtemp/{type}/{value}:
    name: chemi_chet_chemicals_chemtemp
    file: R/chemi_chet_chemicals_chemtemp.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: true
    docs:
      title: Fetch temporary chemical details
      lifecycle: experimental
      return: Decoded JSON, text, or raw download bytes according to the response
        content type; NULL for an empty response.
      tags:
        apiStage: public
  GET /curators/me:
    name: chemi_chet_curators_me
    file: R/chemi_chet_curators_me.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: true
    docs:
      title: Inspect the current CheT curator session
      lifecycle: experimental
      return: Decoded JSON, text, or raw download bytes according to the response
        content type; NULL for an empty response.
      tags:
        apiStage: public
hook_config: inst/hook_config.yml
