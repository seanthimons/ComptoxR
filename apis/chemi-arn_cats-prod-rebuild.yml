id: chemi-arn_cats-prod-rebuild
schemas:
  files:
  - schema/chemi-arn_cats-prod.json
selection:
  include:
  - GET /api/arn_cats
  - POST /api/arn_cats
helper: generic_request
documentation: yes
operations:
  GET /api/arn_cats:
    name: chemi_arn_cats
    file: R/chemi_arn_cats.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    response_policy: .ct_static_list
    docs:
      title: Generate an ARN category for one molecule
      lifecycle: experimental
      return: Returns a list of results
      examples:
      - smiles: DTXSID7020182
      tags:
        apiStage: public
  POST /api/arn_cats:
    name: chemi_arn_cats_bulk
    file: R/chemi_arn_cats.R
    helper: generic_chemi_request
    implementation: generated
    inputs:
      chemicals:
        type: character
        default: ~
        description: Array of objects with optional id and smiles, or an array of
          SMILES strings for backward compatibility.
      model:
        type: character
        default: RF
        description: 'Optional parameter. Options: RF, NN (default: RF)'
      smiles:
        type: character
        default: ~
        description: Array of SMILES strings, same input style as amnb_nate.
    request:
      arguments:
        query:
          from:
          - params
          - chemicals
        endpoint:
          value: arn_cats
        options:
          compact_object:
            model:
              from:
              - params
              - model
            smiles:
              from:
              - params
              - smiles
        tidy:
          value: no
    docs:
      title: Generate groups for multiple molecules
      lifecycle: experimental
      parameters:
        chemicals: Array of objects with optional id and smiles, or an array of SMILES
          strings for backward compatibility.
        model: 'Optional parameter. Options: RF, NN (default: RF)'
        smiles: Array of SMILES strings, same input style as amnb_nate.
      return: Returns a list with result object
      examples:
      - chemicals: DTXSID1024122
      tags:
        apiStage: public
contracts_file: tests/testthat/fixtures/specmill-rebuild-contracts.rds
