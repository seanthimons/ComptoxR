{
  "id": "chemi-released-boolean-bindings",
  "schemas": {
    "files": [
      "schema/chemi_opera_prod.json",
      "schema/chemi_resolver_prod.json",
      "schema/chemi_alerts_prod.json",
      "schema/chemi_stdizer_prod.json"
    ]
  },
  "selection": {
    "include": [
      "POST /api/opera/file",
      "POST /api/resolver/exportsimilaritylist",
      "POST /api/resolver/exportsimilaritymap"
    ]
  },
  "helper": ".ct_request",
  "documentation": true,
  "operations": {
    "POST /api/opera/file": {
      "name": "chemi_opera_file",
      "file": "R/chemi_opera_file.R",
      "implementation": "generated",
      "server": {
        "resolver": ".ct_server_url",
        "key": "chemi_burl"
      },
      "request_controls": {
        "preserve_errors": true
      },
      "docs": {
        "title": "Calculate OPERA predictions from a file",
        "lifecycle": "experimental",
        "tags": {
          "apiStage": "public"
        },
        "return": "Decoded JSON or text, raw binary bytes, or NULL for an empty response."
      }
    },
    "POST /api/resolver/exportsimilaritylist": {
      "name": "chemi_resolver_exportsimilaritylist",
      "file": "R/chemi_resolver_exportsimilaritylist.R",
      "implementation": "generated",
      "server": {
        "resolver": ".ct_server_url",
        "key": "chemi_burl"
      },
      "request_controls": {
        "preserve_errors": true
      },
      "docs": {
        "title": "chemi_resolver_exportsimilaritylist",
        "lifecycle": "experimental",
        "tags": {
          "apiStage": "public"
        },
        "return": "Decoded JSON or text, raw binary bytes, or NULL for an empty response."
      }
    },
    "POST /api/resolver/exportsimilaritymap": {
      "name": "chemi_resolver_exportsimilaritymap",
      "file": "R/chemi_resolver_exportsimilaritymap.R",
      "implementation": "generated",
      "server": {
        "resolver": ".ct_server_url",
        "key": "chemi_burl"
      },
      "request_controls": {
        "preserve_errors": true
      },
      "docs": {
        "title": "chemi_resolver_exportsimilaritymap",
        "lifecycle": "experimental",
        "tags": {
          "apiStage": "public"
        },
        "return": "Decoded JSON or text, raw binary bytes, or NULL for an empty response."
      }
    }
  },
  "hook_config": "inst/hook_config.yml"
}
