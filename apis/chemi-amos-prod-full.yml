helper: generic_request
documentation: yes
operations:
  GET /api/amos/database_summary/:
    name: chemi_amos_database
    file: R/chemi_amos_database.R
    helper: generic_request
    implementation: generated
    inputs: {}
    request:
      arguments:
        endpoint:
          value: amos/database_summary/
        method:
          value: GET
        batch_limit:
          value: 0.0
        server:
          value: chemi_burl
        auth:
          value: no
        tidy:
          value: no
    docs:
      title: Returns a summary of the records in the database, organized by record
        types, methodologies, and sources.
      lifecycle: experimental
      parameters: {}
      return: Returns a tibble with results
      tags:
        apiStage: public
      examples:
      - {}
