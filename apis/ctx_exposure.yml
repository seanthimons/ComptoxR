# ctx_exposure: every operation in schema/ctx_exposure_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: ctx_exposure
schemas:
  files:
  - schema/ctx_exposure_prod.json
# CTX routes need the project's ctx API key.
authentication:
  api_key: ctx
# why: released CTX wrappers chunk vector input at batch_limit (default 100) and drop failed chunks.
defaults:
  batch:
    max_items: 100
    split: true
    on_error: drop
groups:
  ctx_exposure:
    hook_config: inst/hook_config.yml
    contracts_file: tests/testthat/fixtures/specmill-contracts.rds
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /exposure/ccd/chem-weight-fractions/search/by-dtxsid/{dtxsid}: ct_exposure_ccd_chem_weight_fractions_search_by_dtxsid
      GET /exposure/ccd/functional-use/search/by-dtxsid/{dtxsid}: ct_exposure_ccd_functional_use_search_by_dtxsid
      GET /exposure/ccd/keywords/search/by-dtxsid/{dtxsid}: ct_exposure_ccd_keywords_search_by_dtxsid
      GET /exposure/ccd/monitoring-data/search/by-dtxsid/{dtxsid}: ct_exposure_ccd_monitoring_data_search_by_dtxsid
      GET /exposure/ccd/production-volume/search/by-dtxsid/{dtxsid}: ct_exposure_ccd_production_volume_search_by_dtxsid
      GET /exposure/ccd/puc/search/by-dtxsid/{dtxsid}: ct_exposure_ccd_puc_search_by_dtxsid
      GET /exposure/functional-use/category: ct_exposure_functional_use_category
      GET /exposure/functional-use/probability/search/by-dtxsid/{dtxsid}: ct_exposure_functional_use_probability_search_by_dtxsid
      GET /exposure/functional-use/search/by-dtxsid/{dtxsid}: ct_exposure_functional_use_search_by_dtxsid
      GET /exposure/httk/search/by-dtxsid/{dtxsid}: ct_exposure_httk_search_by_dtxsid
      GET /exposure/list-presence/search/by-dtxsid/{dtxsid}: ct_exposure_list_presence_search_by_dtxsid
      GET /exposure/list-presence/tags: ct_exposure_list_presence_tags
      GET /exposure/mmdb/aggregate/by-dtxsid/{dtxsid}: ct_exposure_mmdb_aggregate_by_dtxsid
      GET /exposure/mmdb/aggregate/by-medium: ct_exposure_mmdb_aggregate_by_medium
      GET /exposure/mmdb/mediums: ct_exposure_mmdb_mediums
      GET /exposure/mmdb/single-sample/by-dtxsid/{dtxsid}: ct_exposure_mmdb_single_sample_by_dtxsid
      GET /exposure/mmdb/single-sample/by-medium: ct_exposure_mmdb_single_sample_by_medium
      GET /exposure/product-data/puc: ct_exposure_product_data_puc
      GET /exposure/product-data/search/by-dtxsid/{dtxsid}: ct_exposure_product_data_search_by_dtxsid
      GET /exposure/seem/demographic/search/by-dtxsid/{dtxsid}: ct_exposure_seem_demographic_search_by_dtxsid
      GET /exposure/seem/general/search/by-dtxsid/{dtxsid}: ct_exposure_seem_general_search_by_dtxsid
      POST /exposure/functional-use/search/by-dtxsid/: ct_exposure_functional_use_search_by_dtxsid_bulk
      POST /exposure/httk/search/by-dtxsid/: ct_exposure_httk_search_by_dtxsid_bulk
