helper: .ct_request
documentation: true
operations:
  GET /api/hazard/download:
    name: chemi_hazard_download
    file: R/chemi_hazard_download.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    docs:
      title: Download a hazard report file
      lifecycle: experimental
      return: The decoded service response, preserving JSON structure, text or media
