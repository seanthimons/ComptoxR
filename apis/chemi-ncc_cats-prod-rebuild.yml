id: chemi-ncc_cats-prod-rebuild
schemas:
  files:
  - schema/chemi-ncc_cats-prod.json
selection:
  include:
  - GET /api/ncc_cats
  - POST /api/ncc_cats
helper: generic_request
documentation: yes
operations:
  GET /api/ncc_cats:
    name: chemi_ncc_cats
    file: R/chemi_ncc_cats.R
    helper: generic_request
    implementation: generated
    inputs:
      smiles:
        type: character
        required: yes
        description: SMILES to generate NCC categories for
      logp:
        type: character
        default: ~
        description: Octanol-water partition coefficient
      ws:
        type: character
        default: ~
        description: Water solubility (mg/L)
    request:
      arguments:
        endpoint:
          value: ncc_cats
        method:
          value: GET
        batch_limit:
          value: 0.0
        server:
          value: chemi_burl
        auth:
          value: no
        tidy:
          value: no
        options:
          compact_object:
            smiles:
              from:
              - params
              - smiles
            logp:
              from:
              - params
              - logp
            ws:
              from:
              - params
              - ws
    docs:
      title: Generate NCC categories for one molecule
      lifecycle: experimental
      parameters:
        smiles: SMILES to generate NCC categories for
        logp: Octanol-water partition coefficient
        ws: Water solubility (mg/L)
      return: Returns a list with result object
      examples:
      - smiles: DTXSID7020182
      tags:
        apiStage: public
  POST /api/ncc_cats:
    name: chemi_ncc_cats_bulk
    file: R/chemi_ncc_cats.R
    helper: generic_chemi_request
    implementation: generated
    inputs:
      chemicals:
        type: character
        default: ~
        description: Array of input chemicals with optional id, smiles, logp, and
          ws. Missing smiles are returned as item-level errors.
    request:
      arguments:
        query:
          from:
          - params
          - chemicals
        endpoint:
          value: ncc_cats
        wrap:
          value: no
        tidy:
          value: no
    docs:
      title: Generate NCC categories for multiple molecules
      lifecycle: experimental
      parameters:
        chemicals: Array of input chemicals with optional id, smiles, logp, and ws.
          Missing smiles are returned as item-level errors.
      return: Returns a list with result object
      examples:
      - chemicals: DTXSID1024122
      tags:
        apiStage: public
contracts_file: tests/testthat/fixtures/specmill-rebuild-contracts.rds
