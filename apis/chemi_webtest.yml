                - options
            body:
              value: ~
            headers:
              value:
                Accept: application/json
            server:
              object:
                url:
                  from:
                    - hook_state
                    - request
                    - server
            auth:
              value: []
            response_policy:
              callback: descriptor_get_response
            request_controls:
              value:
                preserve_errors: yes
        docs:
          title: Webtest Predict
          lifecycle: experimental
          parameters:
            smiles: Required parameter
            endpoint: Optional parameter
            method: 'Optional parameter (default: consensus)'
            format: 'Optional parameter. Options: UNKNOWN, SDF, SMI, MOL, CSV, TSV, JSON,
              XLSX, PDF, HTML, XML, DOCX'
            output: 'Output contract: normalized wide tibble or raw PredictionResult'
          return: Returns a tibble with results
          examples:
            - smiles: DTXSID7020182
          tags:
            apiStage: public
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
      # why: server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/webtest/report:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
        docs:
          title: Retrieve a previously generated WebTEST report
          lifecycle: experimental
          tags:
            apiStage: public
          return: Decoded JSON or text, raw binary bytes, or NULL for an empty response.
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/webtest/version:
        server:
