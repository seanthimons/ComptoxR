id: ctx-pilot
schemas:
  files:
  - schema/ctx-chemical-prod.json
selection:
  include:
  - GET /chemical/detail/search/by-dtxsid/{dtxsid}
  - POST /chemical/detail/search/by-dtxsid/
  - GET /chemical/list/all
helper: .ct_request
authentication:
  api_key: ctx
documentation: yes
operations:
  GET /chemical/detail/search/by-dtxsid/{dtxsid}:
    name: ct_chemical_detail_search
    file: R/ct_chemical_detail_search.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: ctx_burl
    response_policy: .ct_tidy
    batch:
      fan_out: dtxsid
      on_error: drop
      empty: .ct_empty_table
    docs:
      title: Get data by DTXSID
      lifecycle: stable
      return: Returns a tibble with results
      examples:
      - dtxsid: DTXSID7020182
    normalize_inputs:
      dtxsid: .ct_legacy_query
  POST /chemical/detail/search/by-dtxsid/:
    name: ct_chemical_detail_search_bulk
    file: R/ct_chemical_detail_search_bulk.R
    helper: .ct_request
    implementation: generated
    body:
      name: query
    parameter_order:
    - query
    - projection
    server:
      resolver: .ct_server_url
      key: ctx_burl
    response_policy: .ct_http_policy_ct_chemical_detail_search_bulk
    normalize_inputs:
      query: .ct_legacy_query
    batch:
      max_items:
        env: batch_limit
        default: 100
      split: yes
      on_error:
        single: stop
        multiple: drop
      empty: .ct_empty_table
      metadata: no
      warning: .ct_batch_http_warning
    docs:
      title: Get chemical details in bulk
      lifecycle: stable
      return: Returns a tibble with results
      examples:
      - query:
        - DTXSID7020182
        - DTXSID9020112
  GET /chemical/list/all:
    name: ct_chemical_list_all
    file: R/ct_chemical_list_all.R
    implementation: generated
    inputs:
      projection:
        default: chemicallistall
        type: character
        description: 'Projection options for chemical lists: chemicallistall, chemicallistwithdtxsids,
          chemicallistname, or ccdchemicaldetaillists.'
      return_dtxsid:
        default: no
        type: logical
        description: Return all DTXSIDs contained within each list.
      coerce:
        default: no
        type: logical
        description: Split DTXSID strings into per-list vectors when return_dtxsid
          is TRUE.
    request:
      arguments:
        method:
          value: GET
        path:
          value: /chemical/list/all
        path_params:
          value: {}
        query:
          object:
            projection:
              from:
              - params
              - projection
        body:
          value: ~
        headers:
          value:
            Accept: application/json
        server:
          value:
            url: https://comptox.epa.gov/ctx-api
        server_resolver:
          value:
            name: .ct_server_url
            key: ctx_burl
        auth:
          value:
          - - scheme: ctx
              type: apiKey
              location: header
              name: x-api-key
              envvar: ctx_api_key
        response_policy:
          value: .ct_list_all
    helper: .ct_request
    server:
      resolver: .ct_server_url
      key: ctx_burl
    response_policy: .ct_list_all
    post_on_skip: no
    post_state: parameters
    docs:
      title: Get all lists
      lifecycle: stable
      return: A tibble of chemical lists, or a named list when both return_dtxsid
        and coerce are TRUE.
      tags:
        apiStage: public
      examples:
      - projection: chemicallistall
contracts_file: tests/testthat/fixtures/specmill-pilot-contracts.rds
hook_config: inst/hook_config.yml
