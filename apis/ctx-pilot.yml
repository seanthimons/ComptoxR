id: ctx-pilot
schemas:
  files:
  - schema/ctx-chemical-prod.json
selection:
  include:
  - GET /chemical/detail/search/by-dtxsid/{dtxsid}
  - POST /chemical/detail/search/by-dtxsid/
  - GET /chemical/list/all
helper: generic_request
authentication:
  api_key: ctx
documentation: yes
operations:
  GET /chemical/detail/search/by-dtxsid/{dtxsid}:
    name: ct_chemical_detail_search
    file: R/ct_chemical_detail_search.R
    helper: .ct_request
    implementation: generated
    server:
      resolver: .ct_server_url
      key: ctx_burl
    response_policy: .ct_tidy
    batch:
      fan_out: dtxsid
      on_error: drop
    docs:
      title: Get data by DTXSID
      lifecycle: stable
      return: Returns a tibble with results
      examples:
      - dtxsid: DTXSID7020182
    normalize_inputs:
      dtxsid: .ct_legacy_query
  POST /chemical/detail/search/by-dtxsid/:
    name: ct_chemical_detail_search_bulk
    file: R/ct_chemical_detail_search_bulk.R
    helper: .ct_request
    implementation: generated
    body:
      name: query
    parameter_order:
    - query
    - projection
    server:
      resolver: .ct_server_url
      key: ctx_burl
    response_policy: .ct_tidy
    normalize_inputs:
      query: .ct_legacy_query
    batch:
      max_items:
        env: batch_limit
        default: 100
      split: yes
      on_error: drop
    docs:
      title: Get chemical details in bulk
      lifecycle: stable
      return: Returns a tibble with results
      examples:
      - query:
        - DTXSID7020182
        - DTXSID9020112
  GET /chemical/list/all:
    name: ct_chemical_list_all
    file: R/ct_chemical_list_all.R
    implementation: existing
    inputs:
      projection:
        default: chemicallistall
        type: character
      return_dtxsid:
        default: no
        type: logical
      coerce:
        default: no
        type: logical
    request:
      arguments:
        endpoint:
          value: chemical/list/all
        method:
          value: GET
        batch_limit:
          value: 0.0
        projection:
          from:
          - params
          - projection
    specialization: Retain stable pre/post hooks, partial parameter updates and early
      skip result.
contracts_file: tests/testthat/fixtures/specmill-pilot-contracts.rds
hook_config: inst/hook_config.yml
