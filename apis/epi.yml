      parameters:
        smiles: SMILES; required when cas is absent.
        cas: CAS Registry Number; required when smiles is absent.
        modules: 'Comma-separated canonical public module names; defaults to all.
          Array order does not control scientific precedence: selected modules run
          in canonical dependency order, with waterSolubilityProvider controlling
          the shared WSKOW/WaterNT choice. Exact implementation IDs are accepted for
          CLI parity but public names are the durable HTTP contract.'
        chemicalName: Optional parameter
        logKow: Optional parameter
        molecularWeight: Optional resolved molecular weight in g/mol. Together with
          positive vapor pressure and water solubility, it enables the HENRYWIN VP/WSOL
          candidate; Bond and Group require only SMILES.
        waterSolubilityMgPerL: Optional resolved water solubility in mg/L. A positive
          VP/WSOL/MW triplet enables the HENRYWIN VP/WSOL candidate; omission does
          not prevent Bond or Group estimation.
        waterSolubility: Optional parameter
        waterSolubilityProvider: 'Selects the source used for downstream resolved
          water solubility. Both WSKOW and WaterNT independent results remain visible
          when all modules run.. Options: wskow, waternt (default: wskow)'
        vaporPressureMmHg: Optional resolved vapor pressure in mmHg. A positive VP/WSOL/MW
          triplet enables the HENRYWIN VP/WSOL candidate; omission does not prevent
          Bond or Group estimation.
        subcooledVaporPressureMmHg: Optional parameter
        henryAtmM3PerMol: Optional parameter
        logKoa: Optional parameter
        koc: Optional parameter
        meltingPointC: Optional parameter
        boilingPointC: Optional parameter
        vaporPressureTemperatureC: 'Compatibility field for the maintained fixed-temperature
          MPBPVP calculation. Only 25 °C is accepted.. Options: 25 (default: 25)'
        aopRateConstant: Optional parameter
        biowinScore: Optional parameter
        biowin3: Optional parameter
        biowin5: Optional parameter
        removeMetals: 'Whether BIOWIN removes selected metal and salt counterions;
          model default is true. (default: TRUE)'
        tspUgPerM3: 'Total suspended particulate matter in ug/m3; AEROWIN default
          is 80. (default: 80)'
        theta: 'Combined Junge-Pankow cTheta in Pa (not particle surface-area Theta);
          AEROWIN default is 0.00010836 Pa. (default: 0.00010836)'
        waterConcentrationMgPerCm3: Optional parameter
        waterConcentrationMgPerLiter: Optional parameter
        eventFrequencyPerDay: Optional parameter
