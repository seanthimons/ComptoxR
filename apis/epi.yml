    inputs: {}
    file: R/epi_ecosar_dye.R
    helper: generic_request
    request:
      arguments:
        endpoint:
          value: ecosar/dye
        method:
          value: GET
        batch_limit:
          value: 0.0
        server:
          value: epi_burl
        auth:
          value: no
        tidy:
          value: no
    docs:
      title: Estimate a cationic dye
      return: Returns a tibble with results
      lifecycle: experimental
      tags:
