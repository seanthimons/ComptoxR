id: epi-pilot
schemas:
  files:
  - schema/epi-suite-prod.json
selection:
  include:
  - GET /api/search
helper: generic_request
documentation: yes
operations:
  GET /api/search:
    name: epi_search
    file: R/epi_search.R
    implementation: generated
    inputs:
      query:
        required: yes
        type: character
        description: Required parameter
      limit:
        default: 20.0
        type: numeric
        description: 'Optional parameter (default: 20)'
    request:
      arguments:
        method:
          value: GET
        path:
          value: /api/search
        path_params:
          value: {}
        query:
          object:
            query:
              from:
              - params
              - query
            limit:
              from:
              - params
              - limit
        body:
          value: ~
        headers:
          value:
            Accept: application/json
        server:
          value:
            diagnostic: Relative server URL requires a recorded origin or explicit
              base URL override
        server_resolver:
          value:
            name: .ct_server_url
            key: epi_burl
            relative: /
        auth:
          value: ~
        response_policy:
          value: .ct_static_list
    docs:
      title: Search embedded experimental data
      lifecycle: experimental
      return: Returns a tibble with results (array of objects)
      tags:
        apiStage: public
      examples:
      - query: benzene
    helper: .ct_request
    server:
      resolver: .ct_server_url
      key: epi_burl
contracts_file: tests/testthat/fixtures/specmill-pilot-contracts.rds
hook_config: inst/hook_config.yml
