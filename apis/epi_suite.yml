# epi_suite: every operation in schema/epi_suite_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: epi_suite
schemas:
  files:
  - schema/epi_suite_prod.json
groups:
  epi_suite:
    hook_config: inst/hook_config.yml
    contracts_file: tests/testthat/fixtures/specmill-contracts.rds
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /api: epi
      GET /api/download: epi_download
      GET /api/ecosar/dye: epi_ecosar_dye
      GET /api/ecosar/polymer/amphoteric: epi_ecosar_polymer_amphoteric
      GET /api/ecosar/polymer/anionic: epi_ecosar_polymer_anionic
      GET /api/ecosar/polymer/nonionic: epi_ecosar_polymer_nonionic
      GET /api/ecosar/polymer/polycationic: epi_ecosar_polymer_polycationic
      GET /api/ecosar/surfactant/amphoteric: epi_ecosar_surfactant_amphoteric
      GET /api/ecosar/surfactant/anionic: epi_ecosar_surfactant_anionic
      GET /api/ecosar/surfactant/cationic: epi_ecosar_surfactant_cationic
      GET /api/ecosar/surfactant/nonionic: epi_ecosar_surfactant_nonionic
      GET /api/search: epi_search
      GET /api/submit: epi_submit
      POST /api/submit/batch: epi_submit_batch
    operations:
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml; renamed from epi_api
      GET /api:
        server:
          resolver: .ct_server_url
          key: epi_burl
        docs:
          title: Retrieve the EPI API specification and health
          lifecycle: experimental
          return: A list containing the API specification and runtime health extensions.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/download:
        server:
          resolver: .ct_server_url
          key: epi_burl
        docs:
          title: Download the running EPI application JAR
          lifecycle: experimental
          return: The exact JAR bytes as a raw vector.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/ecosar/dye:
        server:
          resolver: .ct_server_url
          key: epi_burl
        response_policy: .ct_static_list
        docs:
          title: Estimate a cationic dye
          lifecycle: experimental
          return: Returns a named list of result modules
          tags:
            apiStage: public
          examples:
            - molecularWeight: 300.0
              waterSolubility: 100.0
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/ecosar/polymer/amphoteric:
        server:
          resolver: .ct_server_url
          key: epi_burl
        response_policy: .ct_static_list
        docs:
          title: Estimate an amphoteric polymer
          lifecycle: experimental
          return: Returns a list of results
          tags:
            apiStage: public
          examples:
            - solubilityType: INSOLUBLE
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/ecosar/polymer/anionic:
        server:
          resolver: .ct_server_url
          key: epi_burl
        response_policy: .ct_static_list
        docs:
          title: Estimate an anionic polymer
          lifecycle: experimental
          return: Returns a list of results
          tags:
            apiStage: public
          examples:
            - solubilityType: INSOLUBLE
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/ecosar/polymer/nonionic:
        server:
          resolver: .ct_server_url
          key: epi_burl
        response_policy: .ct_static_list
        docs:
          title: Estimate a nonionic polymer
          lifecycle: experimental
          return: Returns a named list of result modules
          tags:
            apiStage: public
          examples:
            - solubilityType: INSOLUBLE
              averageMolecularWeight: 5000.0
              mw500Percentage: 5.0
              mw1000Percentage: 10.0
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/ecosar/polymer/polycationic:
        server:
          resolver: .ct_server_url
          key: epi_burl
        response_policy: .ct_static_list
        docs:
          title: Estimate a polycationic polymer
          lifecycle: experimental
          return: Returns a list of results
          tags:
            apiStage: public
          examples:
            - {}
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/ecosar/surfactant/amphoteric:
        server:
          resolver: .ct_server_url
          key: epi_burl
        response_policy: .ct_static_list
        docs:
          title: Estimate an amphoteric surfactant
          lifecycle: experimental
          return: Returns a list of results
          tags:
            apiStage: public
          examples:
            - carbonChainLength: 8
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/ecosar/surfactant/anionic:
        server:
          resolver: .ct_server_url
          key: epi_burl
        response_policy: .ct_static_list
        docs:
          title: Estimate an anionic surfactant
          lifecycle: experimental
          return: Returns a list of results
          tags:
            apiStage: public
          examples:
            - carbonChainLength: 1
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/ecosar/surfactant/cationic:
        server:
          resolver: .ct_server_url
          key: epi_burl
        response_policy: .ct_static_list
        docs:
          title: Estimate a cationic surfactant
          lifecycle: experimental
          return: Returns a list of results
          tags:
            apiStage: public
          examples:
            - carbonChainLength: 1
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/ecosar/surfactant/nonionic:
        server:
          resolver: .ct_server_url
          key: epi_burl
        response_policy: .ct_static_list
        docs:
          title: Estimate a nonionic surfactant
          lifecycle: experimental
          return: Returns a named list of result modules
          tags:
            apiStage: public
          examples:
            - mainCarbons: 12
              waterSolubility: 100.0
              logKow: 3.0
              molecularWeight: 250.0
      # why: inputs keep released argument names/defaults; request arguments pin the released wire call; docs keep the released title, return and examples; server resolver keeps the user-overridable base URL option; hooks/extra arguments come from inst/hook_config.yml
      GET /api/search:
        inputs:
          query:
            required: yes
            type: character
            description: Required parameter
          limit:
            default: 20.0
            type: numeric
            description: 'Optional parameter (default: 20)'
        request:
          arguments:
            method:
              value: GET
            path:
              value: /api/search
            path_params:
              value: {}
            query:
              object:
                query:
                  from:
                    - params
                    - query
                limit:
                  from:
                    - params
                    - limit
            body:
              value: ~
            headers:
              value:
                Accept: application/json
            server:
              value:
                diagnostic: Relative server URL requires a recorded origin or explicit base
                  URL override
            server_resolver:
              value:
                name: .ct_server_url
                key: epi_burl
                relative: /
            auth:
              value: ~
            response_policy:
              value: .ct_static_list
        docs:
          title: Search embedded experimental data
          lifecycle: experimental
          return: Returns a tibble with results (array of objects)
          tags:
            apiStage: public
          examples:
            - query: benzene
        server:
          resolver: .ct_server_url
          key: epi_burl
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples; inputs keep released argument names/defaults; request arguments pin the released wire call; hooks/extra arguments come from inst/hook_config.yml
      GET /api/submit:
        server:
          resolver: .ct_server_url
          key: epi_burl
        response_policy: .ct_static_list
        docs:
          title: Estimate one chemical
          lifecycle: experimental
          return: Returns a named list of result modules
          tags:
            apiStage: public
          examples:
            - smiles: CCO
              modules: logKow
        inputs:
          smiles:
            default: ~
            type: character
            description: SMILES; required when cas is absent.
          cas:
            default: ~
            type: character
            description: CAS Registry Number; required when smiles is absent.
          modules:
            default: ~
            type: character
            description: 'Comma-separated canonical public module names; defaults to all.
              Array order does not control scientific precedence: selected modules run in
              canonical dependency order, with waterSolubilityProvider controlling the shared
              WSKOW/WaterNT choice. Exact implementation IDs are accepted for CLI parity but
              public names are the durable HTTP contract.'
          chemicalName:
            default: ~
            type: character
            description: Optional parameter
          logKow:
            default: ~
            type: numeric
            description: Optional parameter
          molecularWeight:
            default: ~
            type: numeric
            description: Optional resolved molecular weight in g/mol. Together with positive
              vapor pressure and water solubility, it enables the HENRYWIN VP/WSOL candidate;
              Bond and Group require only SMILES.
          waterSolubilityMgPerL:
            default: ~
            type: numeric
            description: Optional resolved water solubility in mg/L. A positive VP/WSOL/MW
              triplet enables the HENRYWIN VP/WSOL candidate; omission does not prevent Bond
              or Group estimation.
          waterSolubility:
            default: ~
            type: numeric
            description: Optional parameter
          waterSolubilityProvider:
            default: wskow
            type: character
            description: 'Selects the source used for downstream resolved water solubility.
              Both WSKOW and WaterNT independent results remain visible when all modules run..
              Options: wskow, waternt (default: wskow)'
          vaporPressureMmHg:
            default: ~
            type: numeric
            description: Optional resolved vapor pressure in mmHg. A positive VP/WSOL/MW triplet
              enables the HENRYWIN VP/WSOL candidate; omission does not prevent Bond or Group
              estimation.
