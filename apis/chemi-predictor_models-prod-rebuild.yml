id: chemi-predictor_models-prod-rebuild
schemas:
  files:
  - schema/chemi-predictor_models-prod.json
selection:
  include:
  - GET /api/predictor_models/predict
  - POST /api/predictor_models/predict
helper: generic_request
documentation: yes
operations:
  GET /api/predictor_models/predict:
    name: chemi_predictor_models_predict
    file: R/chemi_predictor_models_predict.R
    helper: generic_request
    implementation: generated
    inputs:
      model_id:
        type: character
        required: yes
        description: Model ID to use
      smiles:
        type: character
        default: ~
        description: SMILES to generate predictions for
      identifier:
        type: character
        default: ~
        description: identifier to generate predictions for
      report_format:
        type: character
        default: json
        description: 'which format to return (default: json)'
    post_on_skip: no
    post_state: parameters
    request:
      arguments:
        endpoint:
          value: predictor_models/predict
        method:
          value: GET
        batch_limit:
          value: 0.0
        server:
          value: chemi_burl
        auth:
          value: no
        tidy:
          value: no
        options:
          compact_object:
            smiles:
              from:
              - params
              - smiles
            identifier:
              from:
              - params
              - identifier
            model_id:
              from:
              - params
              - model_id
            report_format:
              from:
              - params
              - report_format
    docs:
      title: Predictor Models Predict
      lifecycle: experimental
      parameters:
        smiles: SMILES to generate predictions for
        identifier: identifier to generate predictions for
        model_id: Model ID to use
        report_format: 'which format to return (default: json)'
      return: Returns a tibble with results
      examples:
      - smiles: DTXSID7020182
      tags:
        apiStage: public
  POST /api/predictor_models/predict:
    name: chemi_predictor_models_predict_bulk
    file: R/chemi_predictor_models_predict.R
    helper: generic_chemi_request
    implementation: generated
    inputs:
      model_id:
        type: character
        required: yes
        description: Required parameter
      smiles:
        type: character
        default: ~
        description: Optional parameter
      chemicals:
        type: character
        default: ~
        description: Optional parameter
    post_on_skip: no
    post_state: parameters
    request:
      arguments:
        endpoint:
          value: predictor_models/predict
        body:
          callback: prediction_body
        tidy:
          value: no
    docs:
      title: Generate predictions for multiple molecules
      lifecycle: experimental
      parameters:
        model_id: Required parameter
        smiles: Optional parameter
        chemicals: Optional parameter
      return: Returns a tibble with results
      examples:
      - model_id: DTXSID1024122
      tags:
        apiStage: public
contracts_file: tests/testthat/fixtures/specmill-rebuild-contracts.rds
