id: chemi-chet-options
schemas:
  files:
  - schema/chemi-chet-prod.json
selection:
  include:
  - OPTIONS /reaction/batchsearch
  - OPTIONS /reaction/map_DL
helper: .ct_request
documentation: true
operations:
  OPTIONS /reaction/batchsearch:
    name: chemi_chet_reaction_batchsearch_options
    file: R/chemi_chet_reaction_batchsearch_options.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: true
    docs:
      title: Inspect CheT batchsearch preflight
      lifecycle: experimental
      return: Decoded response; NULL for an empty preflight response.
      tags:
        apiStage: public
  OPTIONS /reaction/map_DL:
    name: chemi_chet_reaction_map_dl_options
    file: R/chemi_chet_reaction_map_dl_options.R
    implementation: generated
    server:
      resolver: .ct_server_url
      key: chemi_burl
    request_controls:
      preserve_errors: true
    docs:
      title: Inspect CheT map_DL preflight
      lifecycle: experimental
      return: Decoded response; NULL for an empty preflight response.
      tags:
        apiStage: public
hook_config: inst/hook_config.yml
