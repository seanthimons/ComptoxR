  - POST /api/hazard
helper: generic_request
documentation: yes
operations:
  GET /api/hazard:
    name: chemi_hazard
    file: R/chemi_hazard.R
    helper: generic_request
    implementation: generated
    inputs:
      query:
        type: character
        required: yes
        description: Required parameter
      full:
        type: logical
        default: yes
        description: 'Optional parameter (default: TRUE)'
      format:
        type: character
        default:
        - compact
        - tidy
        - raw
        description: Output format. One of 'compact', 'tidy', or 'raw'
    request:
      arguments:
        endpoint:
          value: hazard
        method:
          value: GET
        batch_limit:
          value: 0.0
        server:
          value: chemi_burl
        auth:
          value: no
        tidy:
          value: no
        options:
          compact_object:
            query:
              from:
              - params
              - query
            full:
              from:
              - params
              - full
    docs:
      title: Hazard
      lifecycle: experimental
      parameters:
        query: Required parameter
        full: 'Optional parameter (default: TRUE)'
        format: Output format. One of 'compact', 'tidy', or 'raw'
      return: Returns a tibble with results
      examples:
      - query: DTXSID7020182
      tags:
        apiStage: public
