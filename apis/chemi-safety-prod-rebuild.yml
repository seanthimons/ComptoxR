operations:
  POST /api/safety/rqcodes:
    name: chemi_safety_rqcodes
    file: R/chemi_safety_rqcodes.R
    helper: generic_chemi_request
    implementation: existing
    inputs: {}
    request:
      arguments:
        query:
          value: ~
        endpoint:
          value: safety/rqcodes
