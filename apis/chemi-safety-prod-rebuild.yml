id: chemi-safety-prod-rebuild
schemas:
  files:
  - schema/chemi-safety-prod.json
selection:
  unclaimed: true
helper: .ct_request
documentation: yes
hook_config: inst/hook_config.yml
operations:
  POST /api/safety/rqcodes:
    name: chemi_safety_rqcodes
    file: R/chemi_safety_rqcodes.R
    implementation: generated
    inputs:
      query:
        type: any
        default: ~
    normalize_inputs:
      query: .ct_safety_sids
    private_params:
      chemicals: ~
      idType: DTXSID
    request:
      arguments:
        method:
          value: POST
        path:
          value: /api/safety/rqcodes
        path_params:
          value: {}
        query:
          value: {}
        body:
          from:
          - params
          - chemicals
        headers:
          value:
            Accept: application/json
        server:
          value:
            url: https://hcd.rtpnc.epa.gov
        server_resolver:
          value:
            name: .ct_server_url
            key: chemi_burl
            relative: /
        auth:
          value: []
        response_policy:
          callback: resolved_chemical_response
        request_controls:
          value:
            preserve_errors: yes
    request_controls:
      preserve_errors: yes
    docs:
      title: Safety RQ codes
      lifecycle: stable
      return: A tibble of available RQ codes with numeric rq_lbs and rq_kgs, or NULL when none are available.
      parameters:
        query: Character vector of DTXSIDs, resolved before requesting RQ codes.
      examples:
      - query: DTXSID0020153
