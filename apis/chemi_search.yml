# chemi_search: every operation in schema/chemi_search_prod.json that passes the project selection in specmill.yml.
# One group per API; wrappers are written one per file (R/<name>.R).
# Per-operation settings below carry the released wrapper behaviour; each lists why.
api: chemi_search
schemas:
  files:
  - schema/chemi_search_prod.json
groups:
  chemi_search:
    hook_config: inst/hook_config.yml
    contracts_file: tests/testthat/fixtures/specmill-contracts.rds
    prepare: preserve_choice_defaults
    # Route -> wrapper name. Defaults follow naming='path' (see dev/specmill-333/SELECTION.md);
    # entries marked '# why' deviate from that default.
    names:
      GET /api/search/download/mol: chemi_search_download_mol
      GET /api/search/download/mol-by-smiles: chemi_search_download_mol_by_smiles
      GET /api/search/exact: chemi_search_exact
      GET /api/search/gethazard: chemi_search_gethazard
      GET /api/search/metadata: chemi_search_metadata
      GET /api/search/render/png: chemi_search_render_png
      GET /api/search/render/svg: chemi_search_render_svg
      GET /api/search/similar: chemi_search_similar
      GET /api/search/substructure: chemi_search_substructure
      GET /api/search/version: chemi_search_version
      POST /api/search: chemi_search
      POST /api/search/download: chemi_search_download
      POST /api/search/download/properties: chemi_search_download_properties
      POST /api/search/download/search-result-as-sdf: chemi_search_download_search_result_as_sdf
    operations:
      # why: server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/search/download/mol:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
        docs:
          title: Chemi search download mol
          lifecycle: experimental
          return: Decoded JSON, text, or raw bytes according to the response content type;
            NULL for an empty response.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/search/download/mol-by-smiles:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
        docs:
          title: Chemi search download mol by smiles
          lifecycle: experimental
          return: Decoded JSON, text, or raw bytes according to the response content type;
            NULL for an empty response.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/search/exact:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Search Exact
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - smiles: DTXSID7020182
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/search/gethazard:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Search Gethazard
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - sid: DTXSID7020182
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/search/metadata:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve search metadata
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/search/render/png:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
        docs:
          title: Chemi search render png
          lifecycle: experimental
          return: Decoded JSON, text, or raw bytes according to the response content type;
            NULL for an empty response.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/search/render/svg:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
        docs:
          title: Chemi search render svg
          lifecycle: experimental
          return: Decoded JSON, text, or raw bytes according to the response content type;
            NULL for an empty response.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/search/similar:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Search Similar
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - {}
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; response policy keeps the released result shape; docs keep the released title, return and examples
      GET /api/search/substructure:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        response_policy: .ct_static_list
        docs:
          title: Search Substructure
          lifecycle: experimental
          return: Returns a list of results
          examples:
            - smiles: DTXSID7020182
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      GET /api/search/version:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        docs:
          title: Retrieve search version
          lifecycle: experimental
          return: The decoded service response, preserving its declared JSON structure or
            media bytes.
          tags:
            apiStage: public
      # why: inputs keep released argument names/defaults; request arguments pin the released wire call; post-processing still runs when a hook skips the request; post-processing state carries hook data; defers inputs to hooks; passes released arguments to pre-request hooks; post-processing scope matches the released wrapper; result formatter keeps the released output; keeps released NULL result; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      POST /api/search:
        inputs:
          query:
            default: ~
            type: character
          search_type:
            default:
              - exact
              - substructure
              - similar
              - mass
              - hazard
              - features
            type: character
          similarity_type:
            default:
              - tanimoto
              - euclid
              - tversky
            type: character
          min_similarity:
            default: 0.85
            type: numeric
          hazard_name:
            default: ~
            type: character
          min_toxicity:
            default:
              - VH
              - H
              - M
              - L
              - A
            type: character
          min_authority:
            default:
              - auth
              - screen
              - qsar
            type: character
          mass_type:
            default:
              - mono
              - mw
              - abu
            type: character
          min_mass:
            default: ~
            type: character
          max_mass:
            default: ~
            type: character
          filter_features:
            default: no
            type: logical
          feature_filters:
            default: ~
            type: character
          element_include:
            default: ~
            type: character
          element_exclude:
            default: ~
            type: character
          exclude_all_others:
            default: no
            type: logical
          limit:
            default: 50
            type: numeric
          all_pages:
            default: no
            type: logical
        request:
          arguments:
            method:
              value: POST
            path:
              value: /search
            path_params:
              value: []
            query:
              value: []
            body:
              from:
                - hook_state
                - request
                - body
            body_media:
              value: application/json
            headers:
              value:
                Accept: application/json
            server:
              value:
                url: https://hcd.rtpnc.epa.gov/api
            server_resolver:
              value:
                name: .ct_server_url
                key: chemi_burl
                relative: ''
            auth:
              value: []
            response_policy:
              value: .ct_search_page_response
            request_controls:
              value:
                preserve_errors: yes
          pagination:
            mode: offset
            when:
              callback: search_paging
            parameter:
              - body
              - offset
            size_parameter:
              - body
              - params
              - limit
            page_size:
              from:
                - hook_state
                - request
                - options
                - limit
            start:
              value: 0
            max_pages: 100
            items: .ct_search_page_items
            completed: .ct_search_page_done
            advance: .ct_search_page_advance
            metadata: no
            error_policy: partial
            warn_limits: no
            warn_errors: no
            stop_on_empty: no
        post_on_skip: yes
        post_state: hook_state
        defer_inputs:
          - all_pages
        pre_params:
          - query
          - search_type
          - similarity_type
          - min_similarity
          - hazard_name
          - min_toxicity
          - min_authority
          - mass_type
          - min_mass
          - max_mass
          - filter_features
          - feature_filters
          - element_include
          - element_exclude
          - exclude_all_others
          - limit
        post_response_scope: combined
        result_formatter: .ct_search_result
        post_result_null: remove
        docs:
          title: Cheminformatics Search
          description: Search the cheminformatics database using various search types including
            exact structure, substructure, similarity, mass, hazard, and feature searches.
          lifecycle: maturing
          parameters:
            query: Chemical identifier (DTXSID), SMILES string, or MOL file string. Required
              for exact, substructure, and similar searches. Can be NULL for mass, hazard,
              and features searches.
            search_type: 'Type of search to perform. One of: `"exact"` - Exact structure match
              `"substructure"` - Substructure search `"similar"` - Similarity search `"mass"`
              - Mass-based search `"hazard"` - Hazard-based search `"features"` - Feature-based
              search'
            similarity_type: Similarity metric for similar searches. One of `"tanimoto"` (default),
              `"euclid"`, or `"tversky"`.
            min_similarity: Minimum similarity threshold (0-1). Defaults to 0.85.
            hazard_name: 'Hazard endpoint name for hazard searches. Use short names: `"acute_oral"`,
              `"acute_inhal"`, `"acute_dermal"`, `"cancer"`, `"geno"`, `"endo"`, `"reprod"`,
              `"develop"`, `"neuro_single"`, `"neuro_repeat"`, `"sys_single"`, `"sys_repeat"`,
              `"skin_sens"`, `"skin_irr"`, `"eye"`, `"aq_acute"`, `"aq_chron"`, `"persis"`,
              `"bioacc"`, `"expo"`.'
            min_toxicity: Minimum toxicity level for hazard searches. One of `"VH"` (Very
              High), `"H"` (High), `"M"` (Medium), `"L"` (Low), or `"A"` (Any).
            min_authority: Minimum data authority level for hazard searches. One of `"auth"`
              (Authoritative), `"screen"` (Screening), or `"qsar"` (QSAR).
            mass_type: Type of mass for mass searches. One of `"mono"` (monoisotopic mass),
              `"mw"` (molecular weight), or `"abu"` (most abundant mass).
            min_mass: Minimum mass value for mass searches.
            max_mass: Maximum mass value for mass searches.
            filter_features: Logical; whether to apply feature filters. Defaults to FALSE.
            feature_filters: 'Named logical vector of feature filters to apply when `filter_features
              = TRUE`. Valid filter names: `"stereo"`, `"chiral"`, `"isotopes"`, `"charged"`,
              `"multicomponent"`, `"radicals"`, `"salts"`, `"polymers"`, `"sgroups"`.'
            element_include: Character vector of element symbols to include in results.
            element_exclude: Character vector of element symbols to exclude from results.
            exclude_all_others: Logical; if TRUE, excludes all elements except those in `element_include`.
              Defaults to FALSE.
            limit: Maximum number of results to return per page. Defaults to 50.
            all_pages: Logical; if TRUE, automatically fetches all pages via offset/limit
              pagination. If FALSE (default), returns a single page.
          return: A tibble containing search results with columns depending on search type.
            For similarity searches, includes a `relationship` column indicating `"parent"`
            (query compound) or `"child"` (similar compound).
          tags:
            apiStage: public
          examples:
            - query: DTXSID7020182
              search_type: exact
            - query: DTXSID7020182
              search_type: similar
              min_similarity: 0.9
            - query: ~
              search_type: mass
              mass_type: mono
              min_mass: 100
              max_mass: 200
            - query: ~
              search_type: hazard
              hazard_name: cancer
              min_toxicity: H
              min_authority: auth
            - query: ~
              search_type: features
              element_include:
                - C
                - 'N'
                - O
              exclude_all_others: yes
              limit: 100
      # why: server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      POST /api/search/download:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
        docs:
          title: Chemi search download
          lifecycle: experimental
          return: Decoded JSON, text, or raw bytes according to the response content type;
            NULL for an empty response.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml
      POST /api/search/download/properties:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
        docs:
          title: Chemi search download properties
          lifecycle: experimental
          return: Decoded JSON, text, or raw bytes according to the response content type;
            NULL for an empty response.
          tags:
            apiStage: public
      # why: server resolver keeps the user-overridable base URL option; request controls keep the released error behaviour; docs keep the released title, return and examples; hooks/extra arguments come from inst/hook_config.yml; renamed from chemi_search_download_sdf
      POST /api/search/download/search-result-as-sdf:
        server:
          resolver: .ct_server_url
          key: chemi_burl
        request_controls:
          preserve_errors: yes
        docs:
          title: Chemi search download sdf
          lifecycle: experimental
          return: Decoded JSON, text, or raw bytes according to the response content type;
            NULL for an empty response.
          tags:
            apiStage: public
