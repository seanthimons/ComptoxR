helper: .ct_request
documentation: yes
operations:
  POST /api/amos/substances_for_ids/:
    name: chemi_amos_substances_for_ids
    file: R/chemi_amos_substances_for_ids.R
    helper: .ct_request
    implementation: generated
    inputs:
      internal_id_list:
        type: any
        default: ~
    request_controls:
      preserve_errors: yes
    docs:
      title: Returns an Excel file containing a deduplicated list of substances that
        appear in a given set of database record IDs.
      lifecycle: experimental
      return: Decoded JSON records or raw Excel workbook bytes.
      parameters:
        internal_id_list: Array of record IDs.
      tags:
        apiStage: public
    request:
      arguments:
        method:
          value: POST
        path:
          value: /api/amos/substances_for_ids/
        path_params:
          value: []
        query:
          value: []
        body:
          callback: amos_remaining_body
        headers:
          value:
            Accept: application/json, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        server:
          value:
            url: https://hcd.rtpnc.epa.gov
        server_resolver:
          value:
            name: .ct_server_url
            key: chemi_burl
            relative: /
        auth:
