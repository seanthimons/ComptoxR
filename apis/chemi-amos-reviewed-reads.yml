  POST /api/amos/search_for_document_ids/{record_type}:
    name: chemi_amos_for_document_ids
    file: R/chemi_amos_for_document_ids.R
    helper: .ct_request
    implementation: generated
    inputs:
      record_type:
        type: any
      search_info:
        type: any
        default: ~
      record_info_fields:
        type: any
        default: ~
      table_fields:
        type: any
        default: ~
    request_controls:
      preserve_errors: yes
    docs:
      title: Runs a search for document IDs that pass a list of submitted filters,
        including document metadata, substance
      lifecycle: experimental
      return: Decoded JSON records or raw Excel workbook bytes.
      parameters:
        record_type: Record type to filter by.  Should be either 'Fact Sheet', 'Method',
          'Product Declaration', or 'Safety Data Sheet' (capitalization included).
        search_info: Search query parameters.  Exact parameters are still in flux,
          but generally consist of database field names with values and flags for
          whether to perform exact matches or not.
        record_info_fields: List of field names in search_info that are fields in
          the record_info table in PostgreSQL.
        table_fields: List of field names in search_info that are fields in the fact_sheets
          table in PostgreSQL.
      tags:
        apiStage: public
    request:
      arguments:
        method:
          value: POST
        path:
          value: /api/amos/search_for_document_ids/{record_type}
        path_params:
          object:
            record_type:
              from:
              - params
              - record_type
        query:
          value: []
        body:
          callback: amos_remaining_body
        headers:
          value:
            Accept: application/json, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        server:
          value:
            url: https://hcd.rtpnc.epa.gov
        server_resolver:
          value:
            name: .ct_server_url
            key: chemi_burl
            relative: /
        auth:
          value: []
        response_policy:
