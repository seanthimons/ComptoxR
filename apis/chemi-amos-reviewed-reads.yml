  - schema/chemi-amos-reviewed-reads.json
selection:
  include:
  - POST /api/amos/substances_for_ids/
  - POST /api/amos/retrieve_fact_sheets/
  - POST /api/amos/retrieve_product_declarations/
  - POST /api/amos/retrieve_safety_data_sheets/
