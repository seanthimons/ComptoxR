# Hook Configuration for ComptoxR
# Each entry maps a generated function name to its hooks and extra parameters.
# Hooks execute in declared order. Extra params are injected into function signatures.

ct_chemical_list_all:
  extra_params:
    return_dtxsid:
      default: "FALSE"
      type: "logical"
      description: "Return all DTXSIDs contained within each list"
    coerce:
      default: "FALSE"
      type: "logical"
      description: "Coerce DTXSID strings per list to list-column (requires return_dtxsid = TRUE)"
  pre_request:
    - select_chemical_list_all_projection
  post_response:
    - format_chemical_list_all_result

ct_similar:
  extra_params:
    similarity:
      default: "0.8"
      type: "numeric"
      description: "Similarity threshold (0-1)"
  pre_request:
    - validate_similarity

ct_chemical_list_by_name:
  extra_params:
    extract_dtxsids:
      default: "TRUE"
      type: "logical"
      description: "Extract DTXSIDs from results"
  pre_request:
    - uppercase_query
  post_response:
    - extract_dtxsids_if_requested

ct_chemical_list_search_by_name:
  extra_params:
    extract_dtxsids:
      default: "FALSE"
      type: "logical"
      description: "Extract DTXSIDs from results into character vector (requires projection = 'chemicallistwithdtxsids')"
  post_response:
    - extract_dtxsids_if_requested

ct_chemical_list:
  post_response:
    - format_compound_list_result

ct_chemical_property_experimental_bulk:
  extra_params:
    coerce:
      default: "FALSE"
      type: "logical"
      description: "Split results by propertyId into named list of data frames"
  post_response:
    - coerce_by_property_id

ct_chemical_property_predicted_bulk:
  extra_params:
    coerce:
      default: "FALSE"
      type: "logical"
      description: "Split results by propertyId into named list of data frames"
  post_response:
    - coerce_by_property_id

chemi_alerts:
  pre_request:
    - resolve_query_to_chemical_records

chemi_hazard:
  extra_params:
    format:
      default: 'c("compact", "tidy", "raw")'
      type: "character"
      description: "Output format. One of 'compact', 'tidy', or 'raw'"
  post_response:
    - format_chemi_hazard_result

chemi_hazard_bulk:
  extra_params:
    format:
      default: 'c("compact", "tidy", "raw")'
      type: "character"
      description: "Output format. One of 'compact', 'tidy', or 'raw'"
  pre_request:
    - resolve_query_to_chemical_records
  post_response:
    - format_chemi_hazard_result

chemi_resolver_getpubchemlist:
  pre_request:
    - resolve_query_to_chemical_records

chemi_resolver_getsimilaritylist:
  pre_request:
    - resolve_query_to_chemical_records

chemi_resolver_getsimilaritymap:
  return_description: "A cluster list containing a named similarity matrix and hclust object, long-form similarity tibble, or raw API response, selected by `format`"
  extra_params:
    hclust_method:
      default: '"complete"'
      type: "character"
      description: "Hierarchical clustering method passed to stats::hclust()"
    format:
      default: 'c("cluster", "long", "raw")'
      type: "character"
      description: "Output format: cluster result, long-form similarities, or raw API response"
  parameter_overrides:
    sort:
      required: false
      default: "FALSE"
      description: "Logical value controlling API result ordering"
  pre_request:
    - resolve_query_to_chemical_records
    - flatten_similarity_map_chemicals
  post_response:
    - format_similarity_map_result

chemi_resolver_orderBySimilarity:
  pre_request:
    - resolve_query_to_chemical_records

chemi_resolver_pubchem_section_bulk:
  pre_request:
    - resolve_query_to_chemical_records

chemi_resolver_universalharvest_cart:
  pre_request:
    - resolve_query_to_chemical_records

chemi_stdizer_chemicals:
  pre_request:
    - resolve_query_to_chemical_records

chemi_toxprints_calculate_bulk:
  pre_request:
    - resolve_query_to_chemical_records

chemi_descriptors:
  bespoke_test: "tests/testthat/test-chemi_descriptor_contracts.R"
  extra_params:
    output:
      default: 'c("wide", "raw")'
      type: "character"
      description: "Output contract: validated wide tibble or raw payload"
      order: 6
  parameter_overrides:
    smiles:
      required: true
      description: "One SMILES string or resolvable chemical identifier"
      order: 1
    type:
      required: true
      description: "Descriptor engine: padel, rdkit, mordred, or webtest"
      order: 2
    headers:
      default: false
      description: "Request upstream descriptor headers"
      order: 3
    format:
      default: "JSON"
      description: "Response format: JSON, CSV, or TSV"
      order: 4
    timeout:
      default: null
      description: "Optional upstream calculation timeout"
      order: 5
  pre_request:
    - validate_descriptor_request
    - resolve_descriptor_inputs
    - prepare_aggregate_descriptor_request
    - apply_aggregate_mordred_fallback
    - apply_aggregate_rdkit_fallback
  post_response: &descriptor_post
    - validate_descriptor_response
    - recover_descriptor_rows
    - add_descriptor_provenance
    - format_descriptor_result
  request_template: &descriptor_get_request
    helper: generic_request
    post_on_skip: true
    args:
      endpoint: "req_data$request$endpoint"
      method: "req_data$request$method"
      batch_limit: "0"
      server: "req_data$request$server"
      auth: "FALSE"
      tidy: "FALSE"
      content_type: "req_data$request$content_type"
      options: "req_data$request$options"

chemi_descriptors_bulk:
  bespoke_test: "tests/testthat/test-chemi_descriptor_contracts.R"
  extra_params:
    headers:
      default: "FALSE"
      type: "logical"
      description: "Request descriptor headers"
      order: 4
    timeout:
      default: "NULL"
      type: "numeric"
      description: "Optional upstream calculation timeout"
      order: 6
    output:
      default: 'c("wide", "raw")'
      type: "character"
      description: "Output contract: validated wide tibble or raw payload"
      order: 7
  parameter_overrides:
    chemicals:
      name: "query"
      required: true
      description: "Chemical identifiers or structures"
      order: 1
    type:
      required: true
      description: "Descriptor engine: padel, rdkit, mordred, or webtest"
      order: 2
    chemIdType:
      default: "AnyId"
      description: "Input identifier type"
      order: 3
    format:
      default: "JSON"
      description: "Response format: JSON, CSV, or TSV"
      order: 5
    options:
      exclude: true
  pre_request:
    - validate_descriptor_request
    - resolve_descriptor_inputs
    - prepare_aggregate_descriptor_request
    - apply_aggregate_mordred_fallback
    - apply_aggregate_rdkit_fallback
  post_response: *descriptor_post
  request_template: &descriptor_post_request
    helper: generic_chemi_request
    post_on_skip: true
    args:
      endpoint: "req_data$request$endpoint"
      server: "req_data$request$server"
      auth: "FALSE"
      tidy: "FALSE"
      body: "req_data$request$body"
      content_type: "req_data$request$content_type"

