# Hook Configuration for ComptoxR
# Each entry maps a generated function name to its hooks and extra parameters.
# Hooks execute in declared order. Extra params are injected into function signatures.

ct_chemical_list_all:
  extra_params:
    return_dtxsid:
      default: "FALSE"
      type: "logical"
      description: "Return all DTXSIDs contained within each list"
    coerce:
      default: "FALSE"
      type: "logical"
      description: "Coerce DTXSID strings per list to list-column (requires return_dtxsid = TRUE)"
  pre_request:
    - select_chemical_list_all_projection
  post_response:
    - format_chemical_list_all_result

ct_similar:
  extra_params:
    similarity:
      default: "0.8"
      type: "numeric"
      description: "Similarity threshold (0-1)"
  pre_request:
    - validate_similarity

ct_chemical_list_by_name:
  extra_params:
    extract_dtxsids:
      default: "TRUE"
      type: "logical"
      description: "Extract DTXSIDs from results"
  pre_request:
    - uppercase_query
  post_response:
    - extract_dtxsids_if_requested

ct_chemical_list_search_by_name:
  extra_params:
    extract_dtxsids:
      default: "FALSE"
      type: "logical"
      description: "Extract DTXSIDs from results into character vector (requires projection = 'chemicallistwithdtxsids')"
  post_response:
    - extract_dtxsids_if_requested

ct_chemical_list:
  post_response:
    - format_compound_list_result

ct_chemical_property_experimental_bulk:
  extra_params:
    coerce:
      default: "FALSE"
      type: "logical"
      description: "Split results by propertyId into named list of data frames"
  post_response:
    - coerce_by_property_id

ct_chemical_property_predicted_bulk:
  extra_params:
    coerce:
      default: "FALSE"
      type: "logical"
      description: "Split results by propertyId into named list of data frames"
  post_response:
    - coerce_by_property_id

chemi_alerts:
  pre_request:
    - resolve_query_to_chemical_records

chemi_hazard:
  extra_params:
    format:
      default: 'c("compact", "tidy", "raw")'
      type: "character"
      description: "Output format. One of 'compact', 'tidy', or 'raw'"
  post_response:
    - format_chemi_hazard_result

chemi_hazard_bulk:
  extra_params:
    format:
      default: 'c("compact", "tidy", "raw")'
