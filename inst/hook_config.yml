chemi_descriptors:
  extra_params:
    output:
      default: 'c("wide", "raw")'
      type: "character"
      description: "Output contract: validated wide tibble or raw payload"
  pre_request: &descriptor_pre
    - validate_descriptor_request
    - resolve_descriptor_inputs
    - route_descriptor_request
  post_response: &descriptor_post
    - validate_descriptor_response
    - recover_descriptor_rows
    - add_descriptor_provenance
    - format_descriptor_result
  transform: &descriptor_transform
    - descriptor_request_transform

chemi_descriptors_bulk:
  extra_params:
    type:
      required: true
      type: "character"
      description: "Descriptor engine: padel, rdkit, mordred, or webtest"
    chemIdType:
      default: '"AnyId"'
      type: "character"
      description: "Input identifier type"
    headers:
      default: "FALSE"
      type: "logical"
      description: "Request descriptor headers"
    format:
      default: '"JSON"'
      type: "character"
      description: "Response format: JSON, CSV, or TSV"
    timeout:
      default: "NULL"
      type: "numeric"
      description: "Optional upstream calculation timeout"
    output:
      default: 'c("wide", "raw")'
      type: "character"
      description: "Output contract: validated wide tibble or raw payload"
  pre_request: *descriptor_pre
  post_response: *descriptor_post
  transform: *descriptor_transform

