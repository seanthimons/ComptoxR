chemi_descriptors:
  bespoke_test: "tests/testthat/test-native_descriptor_ownership.R"
  extra_params:
    output:
      default: 'c("wide", "raw")'
      type: "character"
      description: "Output contract: validated wide tibble or raw payload"
      order: 6
  parameter_overrides:
    smiles:
      required: true
      description: "One SMILES string or resolvable chemical identifier"
      order: 1
    type:
      required: true
      description: "Descriptor engine: padel, rdkit, mordred, or webtest"
      order: 2
    headers:
      default: false
      description: "Request upstream descriptor headers"
      order: 3
    format:
      default: "JSON"
      description: "Response format: JSON, CSV, or TSV"
      order: 4
    timeout:
      default: null
      description: "Optional upstream calculation timeout"
      order: 5
  pre_request:
    - validate_descriptor_request
    - resolve_descriptor_inputs
    - prepare_aggregate_descriptor_request
    - apply_aggregate_rdkit_fallback
  post_response: &descriptor_post
    - validate_descriptor_response
    - recover_descriptor_rows
    - add_descriptor_provenance
    - format_descriptor_result
  request_template: &descriptor_get_request
    helper: .ct_request
    post_on_skip: true
    args:
      method: '"GET"'
      path: "req_data$request$endpoint"
      query: "req_data$request$options"

chemi_descriptors_bulk:
  bespoke_test: "tests/testthat/test-native_descriptor_ownership.R"
  extra_params:
    headers:
      default: "FALSE"
      type: "logical"
      description: "Request descriptor headers"
      order: 4
    timeout:
      default: "NULL"
      type: "numeric"
      description: "Optional upstream calculation timeout"
      order: 6
    output:
      default: 'c("wide", "raw")'
      type: "character"
      description: "Output contract: validated wide tibble or raw payload"
      order: 7
  parameter_overrides:
    chemicals:
      name: "query"
      required: true
      description: "Chemical identifiers or structures"
      order: 1
    type:
      required: true
      description: "Descriptor engine: padel, rdkit, mordred, or webtest"
      order: 2
    chemIdType:
      default: "AnyId"
      description: "Input identifier type"
      order: 3
    format:
      default: "JSON"
      description: "Response format: JSON, CSV, or TSV"
      order: 5
    options:
      exclude: true
  pre_request:
    - validate_descriptor_request
    - resolve_descriptor_inputs
    - prepare_aggregate_descriptor_request
    - apply_aggregate_rdkit_fallback
  post_response: *descriptor_post
  request_template: &descriptor_post_request
    helper: .ct_request
    post_on_skip: true
    args:
      method: '"POST"'
      path: "req_data$request$endpoint"
      body: "req_data$request$body"

