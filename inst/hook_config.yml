chemi_webtest_predict:
  signature_overrides:
    endpoint:
      required: true
    format:
      default: '"JSON"'
  hook_missing_params:
    - endpoint
  pre_request: &prediction_pre
    - validate_webtest_prediction_request
    - resolve_webtest_prediction_inputs
  post_response: &prediction_post
    - filter_webtest_prediction_result

chemi_webtest_predict_bulk:
  signature_overrides:
    endpoints:
      required: true
    format:
      default: '"JSON"'
  signature_order:
    - structures
    - endpoints
    - methods
    - format
  hook_missing_params:
    - endpoints
  request_override:
    query: structures
    sid_label: structures
    array_payload: true
    top_level:
      - endpoints
      - methods
      - format
  pre_request: *prediction_pre
  post_response: *prediction_post
