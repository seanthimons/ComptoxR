# GitHub Actions workflow to enforce minimum coverage
name: Coverage Check

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.github/**'
      - 'DESCRIPTION'
      - '_pkgdown.yml'
      - 'NAMESPACE'
      - 'man/**'
      - 'vignettes/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.github/**'
      - 'DESCRIPTION'
      - '_pkgdown.yml'
      - 'NAMESPACE'
      - 'man/**'
      - 'vignettes/**'

jobs:
  coverage-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    name: Check Coverage Threshold

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      ctx_api_key: ${{ secrets.CTX_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::testthat
            any::vcr

      - name: Install pinned formatter
        uses: posit-dev/setup-air@v1
        with:
          version: '0.11.0'

      - name: Read reviewed specmill revision
        id: specmill-pin
        shell: Rscript {0}
        run: |
          pin <- jsonlite::read_json("dev/specmill-lock.json")
          stopifnot(grepl("^[0-9a-f]{40}$", pin$source_commit))
          cat(paste0("revision=", pin$source_commit, "\n"),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat(paste0("R_LIBS=", file.path(getwd(), "dev/specmill-pilot/artifacts/toolkit-library", pin$version), "\n"),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      - name: Check out pinned specmill source
        uses: actions/checkout@v7
        with:
          repository: seanthimons/specmill
          ref: ${{ steps.specmill-pin.outputs.revision }}
          path: dev/specmill-pilot/artifacts/toolkit-source
          persist-credentials: false

      - name: Install and verify pinned specmill
        env:
          SPECMILL_SOURCE_REPO: dev/specmill-pilot/artifacts/toolkit-source
        run: Rscript dev/install_specmill.R

      - name: Check coverage meets threshold
        run: |
          # Measure coverage excluding R/data.R
          cov <- covr::package_coverage(
            type = "tests",
            line_exclusions = list("R/data.R")
          )
          percent <- covr::percent_coverage(cov)

          cat(sprintf("\n📊 Current Coverage: %.2f%%\n", percent))

          # Set threshold (warn-only, no failures)
          MINIMUM_COVERAGE <- 75

          if (percent < MINIMUM_COVERAGE) {
            cat(sprintf("⚠️  WARNING: Coverage (%.2f%%) is below target threshold (%.0f%%)\n", percent, MINIMUM_COVERAGE))
          } else {
            cat(sprintf("✓ PASS: Coverage (%.2f%%) meets or exceeds target (%.0f%%)\n", percent, MINIMUM_COVERAGE))
          }

          # Print detailed report
          cat("\n📋 Coverage by File:\n")
          print(cov)
        shell: Rscript {0}

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            // Run coverage again to get results
            const { execSync } = require('child_process');
            const coverage = execSync('Rscript -e "cov <- covr::package_coverage(); cat(sprintf(\'%.2f\', covr::percent_coverage(cov)))"').toString();

            const comment = `## 📊 Test Coverage Report

            **Current Coverage:** ${coverage}%

            | Threshold | Target | Status |
            |-----------|--------|--------|
            | Target | 75% | ${parseFloat(coverage) >= 75 ? '✅' : '⚠️'} |

            **Note:** Coverage is informational only and does not block merges. The 75% target is a guideline.

            <details>
            <summary>View detailed coverage report</summary>

            Run \`covr::report(covr::package_coverage())\` locally for detailed analysis.

            Coverage excludes: R/data.R (documentation-only file)

            </details>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
