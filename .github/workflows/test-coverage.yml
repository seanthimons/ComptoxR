# GitHub Actions workflow for testing and coverage
name: Test Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.github/**'
      - 'DESCRIPTION'
      - '_pkgdown.yml'
      - 'NAMESPACE'
      - 'man/**'
      - 'vignettes/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.github/**'
      - 'DESCRIPTION'
      - '_pkgdown.yml'
      - 'NAMESPACE'
      - 'man/**'
      - 'vignettes/**'

permissions:
  contents: read
  id-token: write

jobs:
  test-coverage:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (R ${{ matrix.r-version }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        r-version: ['release', 'devel']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Keep all tests, with sequential execution on Windows.
      TESTTHAT_PARALLEL: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
      ctx_api_key: ${{ secrets.CTX_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install gettext libgit2 llhttp
          echo "CPATH=$(brew --prefix gettext)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix gettext)/lib:$(brew --prefix llhttp)/lib" >> "$GITHUB_ENV"

      - name: Use source packages for macOS R-devel
        if: runner.os == 'macOS' && matrix.r-version == 'devel'
        run: echo "PKG_PLATFORMS=source" >> "$GITHUB_ENV"

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The pak binary repository has no macOS ARM R-devel 4.7 build.
          pak-version: ${{ runner.os == 'macOS' && matrix.r-version == 'devel' && 'repo' || 'stable' }}
          extra-packages: |
            any::devtools
            any::rcmdcheck
            any::covr
            any::testthat
            any::vcr
          needs: check

      - name: Install pinned formatter
        uses: posit-dev/setup-air@v1
        with:
          version: '0.11.0'

      - name: Read reviewed specmill revision
        id: specmill-pin
        shell: Rscript {0}
        run: |
          pin <- jsonlite::read_json("dev/specmill-lock.json")
          stopifnot(grepl("^[0-9a-f]{40}$", pin$source_commit))
          cat(paste0("revision=", pin$source_commit, "\n"),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat(paste0("R_LIBS=", file.path(getwd(), "dev/specmill-pilot/artifacts/toolkit-library", pin$version), "\n"),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      - name: Check out pinned specmill source
        uses: actions/checkout@v7
        with:
          repository: seanthimons/specmill
          ref: ${{ steps.specmill-pin.outputs.revision }}
          path: dev/specmill-pilot/artifacts/toolkit-source
          persist-credentials: false

      - name: Install and verify pinned specmill
        env:
          SPECMILL_SOURCE_REPO: dev/specmill-pilot/artifacts/toolkit-source
        run: Rscript dev/install_specmill.R

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      - name: Run tests
        run: |
          Rscript -e 'devtools::test()'
        shell: bash

      - name: Calculate coverage
        if: matrix.os == 'ubuntu-latest' && matrix.r-version == 'release'
        run: |
          Rscript -e 'cov <- covr::package_coverage(); print(cov); covr::to_cobertura(cov, filename = "coverage.xml")'
        shell: bash

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.r-version == 'release'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: true
