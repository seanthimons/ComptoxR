# GitHub Actions workflow for pipeline integration tests
name: Pipeline Integration Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.github/**'
      - '.planning/**'
      - 'DESCRIPTION'
      - '_pkgdown.yml'
      - 'NAMESPACE'
      - 'man/**'
      - 'vignettes/**'
  workflow_dispatch:
    inputs:
      rerecord_cassettes:
        description: 'Re-record VCR cassettes (requires API key)'
        required: false
        type: boolean
        default: false

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    name: Integration Tests & Coverage

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      ctx_api_key: ${{ secrets.CTX_API_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::testthat
            any::vcr
            any::withr
            any::here
            any::jsonlite

      - name: Install pinned formatter
        uses: posit-dev/setup-air@v1
        with:
          version: '0.11.0'

      - name: Read reviewed specmill revision
        id: specmill-pin
        shell: Rscript {0}
        run: |
          pin <- jsonlite::read_json("dev/specmill-lock.json")
          stopifnot(grepl("^[0-9a-f]{40}$", pin$source_commit))
          cat(paste0("revision=", pin$source_commit, "\n"),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat(paste0("R_LIBS=", file.path(getwd(), "dev/specmill-pilot/artifacts/toolkit-library", pin$version), "\n"),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      - name: Check out pinned specmill source
        uses: actions/checkout@v7
        with:
          repository: seanthimons/specmill
          ref: ${{ steps.specmill-pin.outputs.revision }}
          path: dev/specmill-pilot/artifacts/toolkit-source
          persist-credentials: false

      - name: Install and verify pinned specmill
        env:
          SPECMILL_SOURCE_REPO: dev/specmill-pilot/artifacts/toolkit-source
        run: Rscript dev/install_specmill.R

      - name: Delete cassettes if re-recording
        if: github.event.inputs.rerecord_cassettes == 'true'
        run: rm -rf tests/testthat/fixtures/integration-*.yml

      - name: Run pipeline integration tests
        id: integration-tests
        run: |
          Rscript -e 'devtools::test(filter = "pipeline")'
        continue-on-error: true

      - name: Check R/ coverage (>= 75%)
        id: r-coverage
        run: |
          Rscript -e '
            r_cov <- covr::package_coverage()
            r_pct <- covr::percent_coverage(r_cov)
            cat(sprintf("\n📊 R/ Coverage: %.2f%%\n", r_pct))
            if (r_pct < 75) {
              cat("❌ FAIL: R/ coverage below 75% threshold (rOpenSci requirement)\n")
              quit(status = 1)
            }
            cat("✅ R/ coverage meets rOpenSci requirement\n")
          '

      - name: Check installed toolkit integration
        run: |
          Rscript dev/generate_specmill.R --check
          Rscript dev/generate_tests.R --check
          Rscript dev/check_hook_config.R
          Rscript -e 'devtools::test(filter = "generate_tests_pipeline|hooks", stop_on_failure = TRUE)'

      - name: Upload R/ coverage to Codecov (dev/ excluded intentionally)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload failure artifacts
        if: always() && (steps.integration-tests.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-failures-${{ github.run_id }}
          path: |
            tests/testthat/failures/*.R
            tests/testthat/failures/*.txt
          retention-days: 5
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.integration-tests.outcome == 'failure'
        run: exit 1

      - name: Create issue on main branch failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: dacbd/create-issue-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Pipeline tests failed on main branch
          body: |
            ## Pipeline Integration Test Failure

            The pipeline integration tests failed on the main branch.

            **Failed Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Commit:** ${{ github.sha }}

            Please investigate the failure artifacts or re-run the workflow.
          labels: bug,CI,pipeline
