name: Specmill Maintenance

on:
  pull_request:
  push:
    branches: [main, integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specmill-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R_KEEP_PKG_SOURCE: yes
      COMPTOXR_CRAN_SAFE_TESTS: "true"
      NOT_CRAN: "false"
      SPECMILL_SOURCE_REPO: dev/specmill-pilot/artifacts/toolkit-source

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::digest
            any::testthat
            any::yaml12
            any::jsonvalidate
            any::V8
          needs: check

      - name: Read reviewed specmill revision
        id: specmill-pin
        shell: Rscript {0}
        run: |
          pin <- jsonlite::read_json("dev/specmill-lock.json")
          stopifnot(grepl("^[0-9a-f]{40}$", pin$source_commit))
          cat(paste0("revision=", pin$source_commit, "\n"),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat(paste0("R_LIBS=", file.path(getwd(), "dev/specmill-pilot/artifacts/toolkit-library", pin$version), "\n"),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      - name: Check out pinned specmill source
        uses: actions/checkout@v7
        with:
          repository: seanthimons/specmill
          ref: ${{ steps.specmill-pin.outputs.revision }}
          path: dev/specmill-pilot/artifacts/toolkit-source
          persist-credentials: false

      - name: Install and verify pinned specmill
        run: Rscript dev/install_specmill.R

      - name: Install specmill formatter
        uses: posit-dev/setup-air@v1
        with:
          version: '0.11.0'

      - name: Check generated wrappers and tests
        run: |
          Rscript -e 'source("dev/check_public_api.R"); check_public_api()'
          Rscript dev/check_hook_config.R
          Rscript dev/specmill-342/verify.R
          Rscript dev/specmill-333/verify.R
          Rscript dev/generate_specmill.R --check
          Rscript dev/generate_tests.R --check

      - name: Run native behavior, fixed contracts and client policy tests
        run: |
          Rscript -e 'testthat::test_local(filter = "^(contract-.*|native_.*|pubchem_offline|hooks_stage_server|chemi_search|ct_chemical_list_all_hooks|specmill_adoption|endpoint_policy|toxprints_bulk)$", stop_on_failure = TRUE)'

      - name: Verify regeneration changes no files
        run: |
          Rscript dev/generate_specmill.R --apply
          Rscript dev/generate_specmill.R --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
