# Quick test workflow for fast feedback on PRs
name: Quick Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main, integration]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.github/**'
      - 'DESCRIPTION'
      - '_pkgdown.yml'
      - 'NAMESPACE'
      - 'man/**'
      - 'vignettes/**'

jobs:
  quick-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    name: Quick Test Suite

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      ctx_api_key: ${{ secrets.CTX_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # setup-r-dependencies also installs system libraries (ImageMagick for
      # magick) and caches the R library.
      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::testthat
            any::vcr

      - name: Run core tests
        run: |
          # Run only core template tests for quick feedback; devtools::test()
          # loads the package, which the test helpers need.
          devtools::test(filter = "^ct_(similar|related)$", stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Check syntax
        run: |
          devtools::check(
            document = FALSE,
            args = c("--no-tests", "--no-examples", "--no-manual"),
            error_on = "warning"
          )
        shell: Rscript {0}
