name: CRAN Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.github/**'
      - '.planning/**'
      - 'DESCRIPTION'
      - '_pkgdown.yml'
      - 'NAMESPACE'
      - 'man/**'
      - 'vignettes/**'
  workflow_dispatch:

jobs:
  cran-readiness:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    name: CRAN-safe Test Readiness
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      COMPTOXR_CRAN_SAFE_TESTS: "true"
      COMPTOXR_CRAN_READINESS_CPUS: "2"
      NOT_CRAN: "false"
      TESTTHAT_CPUS: "2"
      # Sequential: parallel testthat trips a callr subprocess "zero-length variable
      # name" hang on this suite. Restore once fixed — see #253.
      TESTTHAT_PARALLEL: "FALSE"

    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::jsonlite
            any::pkgload
            any::testthat
            any::vcr
            any::withr
          needs: check

      - name: Install pinned formatter
        uses: posit-dev/setup-air@v1
        with:
          version: '0.9.0'

      - name: Read reviewed specmill revision
        id: specmill-pin
        shell: Rscript {0}
        run: |
          pin <- jsonlite::read_json("dev/specmill-lock.json")
          stopifnot(grepl("^[0-9a-f]{40}$", pin$source_commit))
          cat(paste0("revision=", pin$source_commit, "\n"),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

      - name: Check out pinned specmill source
        uses: actions/checkout@v7
        with:
          repository: seanthimons/specmill
          ref: ${{ steps.specmill-pin.outputs.revision }}
          path: dev/specmill-pilot/artifacts/toolkit-source
          persist-credentials: false

      - name: Install and verify pinned specmill
        env:
          SPECMILL_SOURCE_REPO: dev/specmill-pilot/artifacts/toolkit-source
        run: |
          Rscript dev/install_specmill.R
          echo "R_LIBS=$PWD/dev/specmill-pilot/artifacts/toolkit-library" >> "$GITHUB_ENV"

      - name: Check generation and hooks
        run: |
          Rscript dev/generate_specmill.R --check
          Rscript dev/check_hook_config.R
          Rscript dev/check_public_api.R

      - name: Generated-test smoke check
        run: |
          Rscript dev/generate_tests.R --check
          Rscript -e '
            files <- c(
              "tests/testthat/test-chemi_search.R",
              "tests/testthat/test-ct_chemical_detail_search.R",
              "tests/testthat/test-pubchem_search.R"
            )
            for (file in files) {
              testthat::test_file(file)
            }
          '

      - name: Run CRAN readiness
        run: |
          Rscript dev/check_cassette_health.R
          Rscript dev/cran_readiness.R
