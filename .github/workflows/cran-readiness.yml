name: CRAN Readiness

on:
  pull_request:
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.github/**'
      - '.planning/**'
      - 'DESCRIPTION'
      - '_pkgdown.yml'
      - 'NAMESPACE'
      - 'man/**'
      - 'vignettes/**'
  workflow_dispatch:
    inputs:
      toolkit_ref:
        description: 'Optional exact apipak candidate commit for migration validation'
        required: false
        default: ''

jobs:
  cran-readiness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    name: CRAN-safe Test Readiness
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      COMPTOXR_CRAN_SAFE_TESTS: "true"
      COMPTOXR_CRAN_READINESS_CPUS: "2"
      COMPTOXR_CRAN_READINESS_SEQUENTIAL: "true"
      NOT_CRAN: "false"
      TESTTHAT_CPUS: "2"
      # Sequential: parallel testthat trips a callr subprocess "zero-length variable
      # name" hang on this suite. Restore once fixed — see #253.
      TESTTHAT_PARALLEL: "FALSE"

    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::jsonlite
            any::pkgload
            any::testthat
            any::vcr
            any::withr
          needs: check

      - name: Install pinned formatter
        uses: posit-dev/setup-air@v1
        with:
          version: '0.9.0'

      - name: Install pinned development toolkit
        if: inputs.toolkit_ref == ''
        run: Rscript dev/install_toolkit.R

      - name: Install explicitly selected toolkit candidate
        if: inputs.toolkit_ref != ''
        env:
          APIPAK_CANDIDATE_REF: ${{ inputs.toolkit_ref }}
        shell: Rscript {0}
        run: |
          ref <- Sys.getenv('APIPAK_CANDIDATE_REF')
          stopifnot(grepl('^[0-9a-f]{40}$', ref))
          archive <- tempfile(fileext = '.tar.gz')
          curl::curl_download(paste0('https://github.com/seanthimons/apipak/archive/', ref, '.tar.gz'), archive)
          status <- system2(file.path(R.home('bin'), 'R'), c('CMD', 'INSTALL', shQuote(archive)))
          stopifnot(status == 0L)
          # Upgrade only toolkit-version metadata; do not bless changed sources,
          # input fingerprints, callback fingerprints, or generated output.
          apipak::apply_files('.', list(), mode = 'apply')

      - name: Check generation and hooks
        run: |
          Rscript dev/generate_stubs.R --check --rebuild=ct --rebuild=chemi --rebuild=epi
          Rscript dev/check_hook_config.R
          Rscript dev/check_public_api.R

      - name: Generated-test smoke check
        run: |
          Rscript dev/generate_tests.R --check
          Rscript -e '
            files <- c(
              "tests/testthat/test-contract-chemi_search.R",
              "tests/testthat/test-contract-ct_chemical_detail_search.R",
              "tests/testthat/test-pubchem_search.R"
            )
            for (file in files) {
              testthat::test_file(file)
            }
          '

      - name: Run CRAN readiness
        run: |
          Rscript dev/check_cassette_health.R
          Rscript dev/cran_readiness.R
