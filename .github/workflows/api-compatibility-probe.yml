name: API compatibility probe

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CTX_API_KEY: ${{ secrets.CTX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Run direct and wrapper probes
        run: Rscript dev/probe_api_compatibility.R
      - name: Publish sanitized probe matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-compatibility-probe
          path: artifacts/api-compatibility-probe.csv
          retention-days: 14
          if-no-files-found: warn
